  /v2/history/order:
    get:
      tags:
        - History
      summary: Get order history
      description: >-
        Query historical orders. Supports filtering by symbol, status, time
        range, and source. Use source=twap to filter to TWAP child orders.
        Supports unauthenticated access when account_id or vault_id is provided.
      parameters:
        - name: symbol
          in: query
          required: false
          description: Filter by trading pair symbol
          schema:
            type: string
          example: BTC-USDT
        - name: status
          in: query
          required: false
          description: Filter by order status (numeric enum value)
          schema:
            type: string
        - name: order_id
          in: query
          required: false
          description: Filter by specific order ID
          schema:
            type: string
        - name: startTime
          in: query
          required: false
          description: Start timestamp in milliseconds
          schema:
            type: string
          example: '1713806400000'
        - name: endTime
          in: query
          required: false
          description: End timestamp in milliseconds
          schema:
            type: string
          example: '1713892800000'
        - name: limit
          in: query
          required: false
          description: Max results (default 100, max 500)
          schema:
            type: string
          example: '100'
        - name: fromOrderID
          in: query
          required: false
          description: Pagination cursor — returns orders with ID less than this value
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: >-
            Filter by order source. Use "twap" to return only TWAP child
            orders (matches client_order_id prefix).
          schema:
            type: string
            enum:
              - twap
          example: twap
        - name: account_id
          in: query
          required: false
          description: Account ID for public (unauthenticated) queries
          schema:
            type: string
        - name: vault_id
          in: query
          required: false
          description: Vault ID for public vault queries
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderHistoryEntry'
                  count:
                    type: integer
                    description: Number of orders returned
                    example: 25
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/history/fill:
    get:
      tags:
        - History
      summary: Get fill history
      description: >-
        Query historical fills/trades. Supports filtering by symbol, order,
        time range, and source. Use source=twap to filter to fills from TWAP
        child orders. Supports unauthenticated access when account_id or
        vault_id is provided.
      parameters:
        - name: symbol
          in: query
          required: false
          description: Filter by trading pair symbol
          schema:
            type: string
          example: BTC-USDT
        - name: order_id
          in: query
          required: false
          description: Filter fills from a specific order
          schema:
            type: string
        - name: startTime
          in: query
          required: false
          description: Start timestamp in milliseconds
          schema:
            type: string
          example: '1713806400000'
        - name: endTime
          in: query
          required: false
          description: End timestamp in milliseconds
          schema:
            type: string
          example: '1713892800000'
        - name: limit
          in: query
          required: false
          description: Max results (default 500, max 1000)
          schema:
            type: string
          example: '500'
        - name: fromId
          in: query
          required: false
          description: >-
            Backward pagination cursor — returns fills with ID less than
            this value (descending order)
          schema:
            type: string
        - name: since_trade_id
          in: query
          required: false
          description: >-
            Forward pagination cursor — returns fills with trade_id greater
            than this value (ascending order). Cannot be used with fromId.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: >-
            Filter by order source. Use "twap" to return only fills from TWAP
            child orders.
          schema:
            type: string
            enum:
              - twap
          example: twap
        - name: account_id
          in: query
          required: false
          description: Account ID for public (unauthenticated) queries
          schema:
            type: string
        - name: vault_id
          in: query
          required: false
          description: Vault ID for public vault queries
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fills:
                    type: array
                    items:
                      $ref: '#/components/schemas/FillHistoryEntry'
                  count:
                    type: integer
                    description: Number of fills returned
                    example: 50
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
