  /v2/algo/twap:
    post:
      tags:
        - Algo
      summary: Create TWAP strategy
      description: >
        Create a new TWAP (Time-Weighted Average Price) strategy. The strategy
        splits a large order into smaller slices executed at regular intervals
        over the specified duration.


        **Constraints:**

        - `duration_sec`: 300 (5 min) to 86400 (24 hr)

        - `total_size`: must exceed the market's minimum order size

        - Per-slice size must exceed the market's minimum order size

        - Maximum 20 concurrent non-terminal strategies per account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTwapRequest'
            examples:
              basic_twap:
                summary: Basic BUY TWAP over 1 hour
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
              twap_with_limit:
                summary: TWAP with limit price and jitter
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
                  limit_price: '45000.00'
                  randomize: true
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTwapResponse'
        '400':
          description: Invalid request (validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_duration:
                  value:
                    error: 'invalid twap request: duration_sec must be >= 300'
                bad_size:
                  value:
                    error: 'invalid twap request: total_size must be positive'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Concurrent strategy limit reached (max 20)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: concurrent TWAP limit reached
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Algo
      summary: List TWAP strategies
      description: >-
        List TWAP strategies for the authenticated account. By default returns
        only active and cancelling strategies.
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Filter by status. Empty or "active" returns active + cancelling
            strategies. "all" includes terminal statuses. Any other value
            filters to that specific status.
          schema:
            type: string
            enum:
              - active
              - all
              - completed
              - cancelled
              - expired
              - failed
              - liquidated
          example: active
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      $ref: '#/components/schemas/TwapStrategyView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
