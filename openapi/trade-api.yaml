openapi: 3.0.3
info:
  title: Strike Perpetuals - Trade REST API
  description: Order management endpoints for Strike Perpetuals trading platform.
  version: 2.1.0
  contact:
    name: Strike Finance
    url: https://www.strikefinance.org
servers:
- url: https://api.strikefinance.org
  description: Mainnet
- url: https://api-v2-testnet.strikefinance.org
  description: Testnet
tags:
- name: Algo
  description: Algorithmic trading strategies (TWAP)
- name: Orders
  description: Order management (create, cancel, query)
- name: Trading
  description: Leverage, margin mode, and isolated margin operations
- name: History
  description: Order and fill history queries
security:
- ApiWalletAuth: []
components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-API-Wallet-Public-Key
      description: |
        Ed25519 signature-based authentication using API Wallets.

        **Required Headers:**
        - `X-API-Wallet-Public-Key`: Your Ed25519 public key (64 hex characters)
        - `X-API-Wallet-Signature`: Ed25519 signature of the message (128 hex characters)
        - `X-API-Wallet-Timestamp`: Unix timestamp in seconds
        - `X-API-Wallet-Nonce`: Unique UUID v4 per request

        **Signature Message Format:**
        ```
        {METHOD}:{PATH}:{TIMESTAMP}:{NONCE}:{BODY_HASH}
        ```
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        msg:
          type: string
          description: Error message (alternative format)
      required:
      - error
    CreateOrderRequest:
      type: object
      required:
      - symbol
      - side
      - type
      - size
      properties:
        client_order_id:
          type: string
          description: Client-provided order ID for tracking
          example: my-order-001
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        side:
          type: string
          enum:
          - buy
          - sell
          description: Order side
          example: buy
        type:
          type: string
          enum:
          - limit
          - market
          - stop
          - stop_limit
          - take_profit
          - take_profit_limit
          - trailing_stop_market
          description: Order type
          example: limit
        size:
          type: string
          description: Order size in base asset
          example: '0.1'
        price:
          type: string
          description: Order price (required for limit orders)
          example: '50000.00'
        stop_price:
          type: string
          description: Trigger price for conditional orders
          example: '49500.00'
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          default: GTC
          description: |
            Time in force:
            - GTC: Good Till Cancel
            - IOC: Immediate Or Cancel
            - FOK: Fill Or Kill
          example: GTC
        working_type:
          type: string
          enum:
          - mark_price
          - contract_price
          default: mark_price
          description: Price type for trigger evaluation
        post_only:
          type: boolean
          default: false
          description: If true, order will only be maker
        reduce_only:
          type: boolean
          default: false
          description: If true, order can only reduce position
        close_position:
          type: boolean
          default: false
          description: If true, closes entire position when triggered
        price_protect:
          type: boolean
          default: false
          description: If true, enables price protection
        vault_id:
          type: string
          description: Optional vault ID to trade on behalf of a vault (leader only)
          example: vault-abc-123
        callback_rate:
          type: string
          description: 'Trail distance as a percentage for trailing_stop_market orders. Range: "0.1" to
            "5". E.g. "1" = 1%.'
          example: '5'
        activation_price:
          type: string
          description: Price at which trailing begins. Only for trailing_stop_market orders. If omitted,
            trailing activates immediately at current working price.
          example: '67000'
        slippage:
          type: string
          description: Slippage tolerance as a decimal fraction. Only for MARKET orders. E.g. "0.05" =
            5%. Clamped to the market's maximum price bound. If omitted, the market default bound is used.
          example: '0.05'
    CreateOrderResponse:
      type: object
      properties:
        client_order_id:
          type: string
          description: Client-provided order ID
          example: my-order-001
        account_id:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        sequence_id:
          type: integer
          format: int64
          description: Sequence ID for ordering
          example: 789012
        message_id:
          type: string
          description: Message ID for tracking
          example: msg_xyz
    Order:
      type: object
      description: |
        Order model. Field names are PascalCase in JSON responses.
      properties:
        ID:
          type: integer
          format: int64
          description: Order ID
          example: 123456
        ClientOrderID:
          type: string
          description: Client order ID
          example: my-order-001
        AccountID:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
        Symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        Strategy:
          type: object
          nullable: true
          description: Strategy linkage (only present for strategy orders)
          properties:
            ID:
              type: string
              description: Strategy ID
            IsPrimary:
              type: boolean
              description: Whether this is the primary order in the strategy
        CloseReason:
          type: string
          description: Explains why the order was closed
          example: ''
        Side:
          type: string
          enum:
          - buy
          - sell
          - none
          description: Order side
          example: buy
        Status:
          type: string
          enum:
          - pending
          - open
          - filled
          - canceled
          - untriggered
          - rejected
          - expired
          - none
          description: Order status
          example: filled
        Type:
          type: string
          enum:
          - limit
          - market
          - stop
          - stop_limit
          - take_profit
          - take_profit_limit
          - trailing_stop_market
          description: Order type
          example: limit
        OriginType:
          type: string
          enum:
          - limit
          - market
          - stop
          - stop_limit
          - take_profit
          - take_profit_limit
          - trailing_stop_market
          description: Original type of a triggered conditional order
          example: stop_limit
        AutoCloseType:
          type: string
          enum:
          - liquidation
          - adl
          - bankrupt
          - if_transfer
          - ''
          description: Auto-close type (for liquidation/ADL orders)
          example: ''
        TimeInForce:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          description: Time in force
          example: GTC
        WorkingType:
          type: string
          enum:
          - mark_price
          - contract_price
          - none
          description: Working type for triggers
          example: mark_price
        Size:
          type: string
          description: Original order size
          example: '0.1'
        Filled:
          type: string
          description: Filled quantity
          example: '0.1'
        Price:
          type: string
          description: Order price
          example: '50000.00'
        StopPrice:
          type: string
          description: Stop/trigger price
          example: '0'
        BoundPrice:
          type: string
          description: Bound price for market orders
          example: '0'
        PostOnly:
          type: boolean
          description: Post-only flag
          example: false
        ReduceOnly:
          type: boolean
          description: Reduce-only flag
          example: false
        ClosePosition:
          type: boolean
          description: Close position flag
          example: false
        PriceProtect:
          type: boolean
          description: Price protection flag
          example: false
        CallbackRate:
          type: string
          nullable: true
          description: Trail distance in percent (e.g. "5" = 5%). Null for non-trailing orders.
          example: '5'
        ActivationPrice:
          type: string
          nullable: true
          description: Price at which trailing began. If originally omitted, shows the resolved working
            price. Null for non-trailing orders.
          example: '67000'
        TrailingExtreme:
          type: string
          nullable: true
          description: Best price seen since activation (highest for sell, lowest for buy). Updates on
            each favorable tick. Null for non-trailing orders.
          example: '70000'
        TrailingActivated:
          type: boolean
          nullable: true
          description: True if the trailing stop has crossed its activation threshold. Null for non-trailing
            orders.
          example: true
        CreateTimestamp:
          type: integer
          format: int64
          description: When the API received the order (ms)
          example: 1704067200000
        EntryTimestamp:
          type: integer
          format: int64
          description: When the engine received the order (ms)
          example: 1704067200050
        EventTimestamp:
          type: integer
          format: int64
          description: Last event time (ms)
          example: 1704067200150
    CancelOrderRequest:
      type: object
      required:
      - order_id
      - symbol
      properties:
        order_id:
          type: integer
          format: int64
          description: Order ID to cancel
          example: 123456
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        vault_id:
          type: string
          description: Optional vault ID to cancel on behalf of a vault (leader only)
          example: vault-abc-123
    CancelOrderResponse:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
          description: Canceled order ID
          example: 123456
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        sequence_id:
          type: integer
          format: int64
          description: Sequence ID
          example: 789012
        message_id:
          type: string
          description: Message ID
          example: msg_xyz
    CancelAllOrdersRequest:
      type: object
      properties:
        symbol:
          type: string
          description: Optional symbol filter. If empty, cancels all orders across all symbols.
          example: BTC-USD
        vault_id:
          type: string
          description: Optional vault ID to cancel on behalf of a vault (leader only)
          example: vault-abc-123
    CancelAllOrdersResponse:
      type: object
      properties:
        account_id:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
        symbol:
          type: string
          description: Symbol filter used
          example: BTC-USD
        canceled_count:
          type: integer
          description: Number of orders canceled (-1 = async, count not available)
          example: -1
        sequence_id:
          type: integer
          format: int64
          description: Sequence ID
          example: 789012
        message_id:
          type: string
          description: Message ID
          example: msg_xyz
    OpenOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        count:
          type: integer
          description: Number of open orders
          example: 5
    StrategyOrderDetails:
      type: object
      required:
      - type
      - size
      - stop_price
      properties:
        client_order_id:
          type: string
          description: Client order ID for this leg
          example: tp-001
        type:
          type: string
          enum:
          - take_profit
          - take_profit_limit
          - stop
          - stop_limit
          description: Order type for TP/SL leg
          example: take_profit
        size:
          type: string
          description: Order size
          example: '0.1'
        price:
          type: string
          description: Limit price (for limit types)
          example: '52000.00'
        stop_price:
          type: string
          description: Trigger price
          example: '52000.00'
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          description: Time in force
          example: GTC
        working_type:
          type: string
          enum:
          - mark_price
          - contract_price
          description: Working type
          example: mark_price
        post_only:
          type: boolean
          description: Post-only flag
          example: false
        price_protect:
          type: boolean
          description: Price protection
          example: false
    CreateStrategyOrderRequest:
      type: object
      required:
      - strategy_id
      - symbol
      - side
      - type
      - size
      properties:
        strategy_id:
          type: string
          description: Client-provided strategy ID
          example: strategy-001
        client_order_id:
          type: string
          description: Client order ID for primary order
          example: primary-001
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        side:
          type: string
          enum:
          - buy
          - sell
          description: Order side
          example: buy
        type:
          type: string
          enum:
          - limit
          - market
          description: Primary order type
          example: limit
        size:
          type: string
          description: Order size
          example: '0.1'
        price:
          type: string
          description: Order price (for limit orders)
          example: '50000.00'
        stop_price:
          type: string
          description: Trigger price for conditional primary orders
          example: '49500.00'
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          description: Time in force
          example: GTC
        working_type:
          type: string
          enum:
          - mark_price
          - contract_price
          description: Price type for trigger evaluation
        post_only:
          type: boolean
          default: false
          description: If true, primary order will only be maker
        reduce_only:
          type: boolean
          default: false
          description: If true, primary order can only reduce position
        close_position:
          type: boolean
          default: false
          description: If true, closes entire position when triggered
        price_protect:
          type: boolean
          default: false
          description: If true, enables price protection
        vault_id:
          type: string
          description: Optional vault ID to trade on behalf of a vault (leader only)
          example: vault-abc-123
        tp_order:
          $ref: '#/components/schemas/StrategyOrderDetails'
          description: Take-profit order configuration
        sl_order:
          $ref: '#/components/schemas/StrategyOrderDetails'
          description: Stop-loss order configuration
    CreateStrategyOrderResponse:
      type: object
      properties:
        strategy_id:
          type: string
          description: Strategy ID
          example: strategy-001
        primary_client_order_id:
          type: string
          description: Primary order client ID
          example: primary-001
        tp_client_order_id:
          type: string
          description: Take-profit order client ID
          example: tp-001
        sl_client_order_id:
          type: string
          description: Stop-loss order client ID
          example: sl-001
        account_id:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        sequence_id:
          type: integer
          format: int64
          description: Sequence ID
          example: 789012
        message_id:
          type: string
          description: Message ID
          example: msg_xyz
    CreateBatchOrdersRequest:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          description: Array of orders to create (minimum 1)
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderRequest'
        vault_id:
          type: string
          description: Optional vault ID to trade on behalf of a vault (leader only)
          example: vault-abc-123
    CreateBatchOrdersResponse:
      type: object
      properties:
        successful:
          type: array
          description: Successfully created orders
          items:
            $ref: '#/components/schemas/CreateOrderResponse'
        failed:
          type: array
          description: Orders that failed to create
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index of the failed order in the request array
                example: 2
              error:
                type: string
                description: Error message
                example: insufficient margin
    ReplaceOrderRequest:
      type: object
      required:
      - cancel
      - new_order
      properties:
        cancel:
          $ref: '#/components/schemas/CancelOrderRequest'
          description: The order to cancel
        new_order:
          $ref: '#/components/schemas/CreateOrderRequest'
          description: The new order to create
        vault_id:
          type: string
          description: Optional vault ID to replace on behalf of a vault (leader only)
          example: vault-abc-123
    ReplaceOrderResponse:
      type: object
      properties:
        cancel:
          $ref: '#/components/schemas/CancelOrderResponse'
        new_order:
          $ref: '#/components/schemas/CreateOrderResponse'
    ReplaceBatchOrdersRequest:
      type: object
      required:
      - replacements
      properties:
        replacements:
          type: array
          description: Array of replace operations (minimum 1)
          minItems: 1
          items:
            $ref: '#/components/schemas/ReplaceOrderRequest'
        vault_id:
          type: string
          description: Optional vault ID to replace on behalf of a vault (leader only)
          example: vault-abc-123
    ReplaceBatchOrdersResponse:
      type: object
      properties:
        results:
          type: array
          description: Results for each replacement operation
          items:
            $ref: '#/components/schemas/ReplaceOrderResponse'
    CreateTwapRequest:
      type: object
      required:
      - symbol
      - side
      - total_size
      - duration_sec
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USDT
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order side
          example: BUY
        total_size:
          type: string
          description: Total quantity to execute (decimal string)
          example: '1.5'
        duration_sec:
          type: integer
          description: Execution duration in seconds (min 300, max 86400)
          minimum: 300
          maximum: 86400
          example: 3600
        limit_price:
          type: string
          description: Optional hard cap price. Slices whose projected fill price would cross it are skipped.
          example: '45000.00'
        reduce_only:
          type: boolean
          default: false
          description: If true, slices can only reduce an existing position
        randomize:
          type: boolean
          default: false
          description: Enable time/size jitter to reduce predictability
    CreateTwapResponse:
      type: object
      properties:
        strategy_id:
          type: string
          description: Unique strategy identifier (UUID v7)
          example: 019681a3-7e00-7000-8000-000000000001
        status:
          type: string
          description: Initial status (always "active")
          example: active
    CancelTwapResponse:
      type: object
      properties:
        strategy_id:
          type: string
          description: Strategy identifier
          example: 019681a3-7e00-7000-8000-000000000001
        status:
          type: string
          description: Status after cancellation request (always "cancelling")
          example: cancelling
    TwapStrategyView:
      type: object
      properties:
        strategy_id:
          type: string
          description: Unique strategy identifier
          example: 019681a3-7e00-7000-8000-000000000001
        account_id:
          type: string
          description: Account that owns the strategy
          example: 01234567-89ab-cdef-0123-456789abcdef
        market:
          type: string
          description: Trading pair symbol
          example: BTC-USDT
        status:
          type: string
          enum:
          - pending
          - active
          - cancelling
          - completed
          - cancelled
          - expired
          - failed
          - liquidated
          description: Current strategy status
          example: active
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order side
          example: BUY
        total_size:
          type: string
          description: Total quantity to execute
          example: '1.5'
        filled_size:
          type: string
          description: Quantity executed so far
          example: '0.75'
        duration_sec:
          type: integer
          description: Execution duration in seconds
          example: 3600
        slices_fired:
          type: integer
          description: Number of child orders placed so far
          example: 60
        nominal_slices:
          type: integer
          description: Expected total number of slices
          example: 120
        created_at_ms:
          type: integer
          format: int64
          description: Creation timestamp (ms)
          example: 1713806400000
        updated_at_ms:
          type: integer
          format: int64
          description: Last update timestamp (ms)
          example: 1713810000000
        completed_at_ms:
          type: integer
          format: int64
          nullable: true
          description: Completion timestamp (ms), null while active
          example: null
        last_error:
          type: string
          description: Error message if strategy failed
          example: ''
    OrderHistoryEntry:
      type: object
      description: |
        Order history entry. Includes all standard Order fields plus strategy linkage when the order belongs to a TWAP or bracket strategy.
      properties:
        ID:
          type: integer
          format: int64
          description: Order ID
          example: 123456
        ClientOrderID:
          type: string
          description: Client order ID
          example: twap-019681a3-1
        AccountID:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
        Symbol:
          type: string
          description: Trading pair
          example: BTC-USDT
        Strategy:
          type: object
          nullable: true
          description: Strategy linkage (present for TWAP / bracket orders)
          properties:
            ID:
              type: string
              description: Parent strategy ID
            IsPrimary:
              type: boolean
              description: Whether this is the primary order in the strategy
        Side:
          type: string
          example: buy
        Status:
          type: string
          example: filled
        Type:
          type: string
          example: market
        Size:
          type: string
          example: '0.125'
        Filled:
          type: string
          example: '0.125'
        Price:
          type: string
          example: '45000.00'
        CreateTimestamp:
          type: integer
          format: int64
          example: 1713806400000
        EventTimestamp:
          type: integer
          format: int64
          example: 1713806400150
    FillHistoryEntry:
      type: object
      properties:
        trade_id:
          type: integer
          format: int64
          description: Unique fill identifier
          example: 789012
        order_id:
          type: integer
          format: int64
          description: Parent order ID
          example: 123456
        symbol:
          type: string
          example: BTC-USDT
        side:
          type: string
          example: buy
        price:
          type: string
          example: '45000.00'
        size:
          type: string
          example: '0.125'
        fee:
          type: string
          example: '0.005625'
        fee_type:
          type: string
          example: taker
        realized_pnl:
          type: string
          example: '0'
        timestamp:
          type: integer
          format: int64
          example: 1713806400150
    LeverageRequest:
      type: object
      required:
      - symbol
      - leverage
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        leverage:
          type: integer
          minimum: 1
          maximum: 125
          description: New leverage value
          example: 10
        vault_id:
          type: string
          description: Optional vault ID. When provided, updates leverage for the vault account. Caller
            must be the vault leader.
    LeverageResponse:
      type: object
      properties:
        leverage:
          type: integer
          description: New leverage value
          example: 10
        maxNotionalValue:
          type: string
          description: Maximum notional value at this leverage
          example: '1000000'
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
    MarginModeRequest:
      type: object
      required:
      - symbol
      - marginMode
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        marginMode:
          type: string
          enum:
          - cross
          - isolated
          description: New margin mode
          example: isolated
        vault_id:
          type: string
          description: Optional vault ID. When provided, updates margin mode for the vault account. Caller
            must be the vault leader.
    MarginModeResponse:
      type: object
      properties:
        marginMode:
          type: string
          description: New margin mode
          example: isolated
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
    ModifyMarginRequest:
      type: object
      required:
      - symbol
      - amount
      - modify_type
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        amount:
          type: string
          description: Amount to add or remove
          example: '500.00'
        modify_type:
          type: string
          description: Modify type (add|remove)
          example: add|remove
        vault_id:
          type: string
          description: Optional vault ID. When provided, modifies margin for the vault's isolated position.
            Caller must be the vault leader.
    ModifyMarginResponse:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
        sequence_id:
          type: integer
          format: int64
          description: Sequence ID
          example: 789012
        message_id:
          type: string
          description: Message ID
          example: msg_xyz
  responses:
    MissingParameter:
      description: Missing required parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: MISSING_PARAMETER
            code: MISSING_PARAMETER
            msg: symbol parameter is required
    InvalidParameter:
      description: Invalid parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_PARAMETER
            code: INVALID_PARAMETER
            msg: invalid parameter
    Unauthorized:
      description: Unauthorized - missing or invalid API wallet authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_headers:
              summary: Missing authentication headers
              value:
                error: missing API wallet authentication headers
            invalid_signature:
              summary: Invalid or expired signature
              value:
                error: authentication failed
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
paths:
  /v2/order:
    post:
      tags:
      - Orders
      summary: Create new order
      description: |
        Create a new order. Supports the following order types:

        | Type | Description |
        |------|-------------|
        | `limit` | Limit order at specified price |
        | `market` | Market order at best available price |
        | `stop` | Stop market order triggered at stop_price |
        | `stop_limit` | Stop limit order triggered at stop_price |
        | `take_profit` | Take profit market order |
        | `take_profit_limit` | Take profit limit order |
        | `trailing_stop_market` | Trailing stop market order that tracks price movement |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              limit_order:
                summary: Limit buy order
                value:
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  size: '0.1'
                  price: '50000.00'
                  time_in_force: GTC
              market_order:
                summary: Market sell order
                value:
                  symbol: BTC-USD
                  side: sell
                  type: market
                  size: '0.1'
              stop_order:
                summary: Stop loss order
                value:
                  symbol: BTC-USD
                  side: sell
                  type: stop
                  size: '0.1'
                  stop_price: '48000.00'
                  reduce_only: true
              trailing_stop_order:
                summary: Trailing stop loss order
                value:
                  symbol: BTC-USD
                  side: sell
                  type: trailing_stop_market
                  size: '1'
                  callback_rate: '5'
                  activation_price: '67000'
                  working_type: contract_price
                  reduce_only: true
              trailing_stop_immediate:
                summary: Trailing stop with immediate activation
                value:
                  symbol: BTC-USD
                  side: sell
                  type: trailing_stop_market
                  size: '1'
                  callback_rate: '3'
                  working_type: contract_price
                  reduce_only: true
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - Orders
      summary: Get order by ID
      description: Get a specific order by order_id or client_order_id. At least one ID must be provided.
        Supports unauthenticated access when vault_id is provided.
      parameters:
      - name: symbol
        in: query
        required: true
        description: Trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: order_id
        in: query
        required: false
        description: Server-assigned order ID
        schema:
          type: integer
          format: int64
      - name: client_order_id
        in: query
        required: false
        description: Client-provided order ID
        schema:
          type: string
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault order queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/MissingParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/order/cancel:
    delete:
      tags:
      - Orders
      summary: Cancel order
      description: Cancel a specific order by order_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancel request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/order/cancel-all:
    delete:
      tags:
      - Orders
      summary: Cancel all orders
      description: Cancel all open orders. Optionally filter by symbol to cancel only orders for a specific
        trading pair.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllOrdersRequest'
      responses:
        '200':
          description: Cancel request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/order/strategy:
    post:
      tags:
      - Orders
      summary: Create strategy order (bracket order)
      description: |
        Create a strategy order with optional take-profit (TP) and stop-loss (SL) orders.

        **Requirements:**
        - At least one of `tp_order` or `sl_order` must be provided
        - The primary order executes first
        - TP/SL orders are placed when the primary order fills
        - If one TP/SL triggers, the other is automatically canceled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyOrderRequest'
            examples:
              bracket_order:
                summary: Long position with TP and SL
                value:
                  strategy_id: strategy-001
                  client_order_id: entry-001
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  size: '0.1'
                  price: '50000.00'
                  tp_order:
                    type: take_profit
                    size: '0.1'
                    stop_price: '55000.00'
                  sl_order:
                    type: stop
                    size: '0.1'
                    stop_price: '48000.00'
      responses:
        '201':
          description: Strategy order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrategyOrderResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/orders/batch:
    post:
      tags:
      - Orders
      summary: Create batch orders
      description: |
        Create multiple orders in a single request. Each order is processed independently — some may succeed while others fail. The response always returns HTTP 200 with both successful and failed results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchOrdersRequest'
            examples:
              batch_limit_orders:
                summary: Multiple limit orders
                value:
                  orders:
                  - symbol: BTC-USD
                    side: buy
                    type: limit
                    size: '0.1'
                    price: '49000.00'
                  - symbol: BTC-USD
                    side: buy
                    type: limit
                    size: '0.1'
                    price: '48000.00'
      responses:
        '200':
          description: Batch processing complete (check individual results for failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchOrdersResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/order/replace:
    post:
      tags:
      - Orders
      summary: Replace order
      description: |
        Atomically cancel an existing order and create a new one. The cancel is executed first; if it fails, the new order is not created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOrderRequest'
            examples:
              replace_limit:
                summary: Replace a limit order with new price
                value:
                  cancel:
                    order_id: 123456
                    symbol: BTC-USD
                  new_order:
                    symbol: BTC-USD
                    side: buy
                    type: limit
                    size: '0.1'
                    price: '49500.00'
      responses:
        '200':
          description: Order replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceOrderResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/order/replace-batch:
    post:
      tags:
      - Orders
      summary: Replace batch orders
      description: |
        Replace multiple orders in a single request. Each replacement is an atomic cancel + create pair. If any individual cancel fails, the entire batch is aborted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBatchOrdersRequest'
            examples:
              replace_batch:
                summary: Replace multiple limit orders
                value:
                  replacements:
                  - cancel:
                      order_id: 123456
                      symbol: BTC-USD
                    new_order:
                      symbol: BTC-USD
                      side: buy
                      type: limit
                      size: '0.1'
                      price: '49500.00'
                  - cancel:
                      order_id: 123457
                      symbol: BTC-USD
                    new_order:
                      symbol: BTC-USD
                      side: sell
                      type: limit
                      size: '0.1'
                      price: '51500.00'
      responses:
        '200':
          description: Batch replacement complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBatchOrdersResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/openOrders:
    get:
      tags:
      - Orders
      summary: Get open orders
      description: Get all open orders for the account. Optionally filter by symbol. Supports unauthenticated
        access when vault_id is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault order queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/algo/twap:
    post:
      tags:
      - Algo
      summary: Create TWAP strategy
      description: |
        Create a new TWAP (Time-Weighted Average Price) strategy. The strategy splits a large order into smaller slices executed at regular intervals over the specified duration.

        **Constraints:**
        - `duration_sec`: 300 (5 min) to 86400 (24 hr)
        - `total_size`: must exceed the market's minimum order size
        - Per-slice size must exceed the market's minimum order size
        - Maximum 20 concurrent non-terminal strategies per account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTwapRequest'
            examples:
              basic_twap:
                summary: Basic BUY TWAP over 1 hour
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
              twap_with_limit:
                summary: TWAP with limit price and jitter
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
                  limit_price: '45000.00'
                  randomize: true
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTwapResponse'
        '400':
          description: Invalid request (validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_duration:
                  value:
                    error: 'invalid twap request: duration_sec must be >= 300'
                bad_size:
                  value:
                    error: 'invalid twap request: total_size must be positive'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Concurrent strategy limit reached (max 20)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: concurrent TWAP limit reached
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Algo
      summary: List TWAP strategies
      description: List TWAP strategies for the authenticated account. By default returns only active
        and cancelling strategies.
      parameters:
      - name: status
        in: query
        required: false
        description: |
          Filter by status. Empty or "active" returns active + cancelling strategies. "all" includes terminal statuses. Any other value filters to that specific status.
        schema:
          type: string
          enum:
          - active
          - all
          - completed
          - cancelled
          - expired
          - failed
          - liquidated
        example: active
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      $ref: '#/components/schemas/TwapStrategyView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/algo/twap/{id}:
    get:
      tags:
      - Algo
      summary: Get TWAP strategy
      description: Fetch details of a single TWAP strategy by ID.
      parameters:
      - name: id
        in: path
        required: true
        description: Strategy ID (UUID)
        schema:
          type: string
        example: 019681a3-7e00-7000-8000-000000000001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwapStrategyView'
        '400':
          description: Missing strategy ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Algo
      summary: Cancel TWAP strategy
      description: Cancel an active TWAP strategy. The strategy transitions to "cancelling" immediately.
        The bot-engine finalizes the cancellation asynchronously once any in-flight child order completes.
      parameters:
      - name: id
        in: path
        required: true
        description: Strategy ID (UUID)
        schema:
          type: string
        example: 019681a3-7e00-7000-8000-000000000001
      responses:
        '200':
          description: Cancel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTwapResponse'
        '400':
          description: Missing strategy ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Strategy not found or not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: strategy not found or not active
        '503':
          description: Algo TWAP service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/history/order:
    get:
      tags:
      - History
      summary: Get order history
      description: Query historical orders. Supports filtering by symbol, status, time range, and source.
        Use source=twap to filter to TWAP child orders. Supports unauthenticated access when account_id
        or vault_id is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USDT
      - name: status
        in: query
        required: false
        description: Filter by order status (numeric enum value)
        schema:
          type: string
      - name: order_id
        in: query
        required: false
        description: Filter by specific order ID
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        description: Start timestamp in milliseconds
        schema:
          type: string
        example: '1713806400000'
      - name: endTime
        in: query
        required: false
        description: End timestamp in milliseconds
        schema:
          type: string
        example: '1713892800000'
      - name: limit
        in: query
        required: false
        description: Max results (default 100, max 500)
        schema:
          type: string
        example: '100'
      - name: fromOrderID
        in: query
        required: false
        description: Pagination cursor — returns orders with ID less than this value
        schema:
          type: string
      - name: source
        in: query
        required: false
        description: Filter by order source. Use "twap" to return only TWAP child orders (matches client_order_id
          prefix).
        schema:
          type: string
          enum:
          - twap
        example: twap
      - name: account_id
        in: query
        required: false
        description: Account ID for public (unauthenticated) queries
        schema:
          type: string
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderHistoryEntry'
                  count:
                    type: integer
                    description: Number of orders returned
                    example: 25
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/history/fill:
    get:
      tags:
      - History
      summary: Get fill history
      description: Query historical fills/trades. Supports filtering by symbol, order, time range, and
        source. Use source=twap to filter to fills from TWAP child orders. Supports unauthenticated access
        when account_id or vault_id is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USDT
      - name: order_id
        in: query
        required: false
        description: Filter fills from a specific order
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        description: Start timestamp in milliseconds
        schema:
          type: string
        example: '1713806400000'
      - name: endTime
        in: query
        required: false
        description: End timestamp in milliseconds
        schema:
          type: string
        example: '1713892800000'
      - name: limit
        in: query
        required: false
        description: Max results (default 500, max 1000)
        schema:
          type: string
        example: '500'
      - name: fromId
        in: query
        required: false
        description: Backward pagination cursor — returns fills with ID less than this value (descending
          order)
        schema:
          type: string
      - name: since_trade_id
        in: query
        required: false
        description: Forward pagination cursor — returns fills with trade_id greater than this value (ascending
          order). Cannot be used with fromId.
        schema:
          type: string
      - name: source
        in: query
        required: false
        description: Filter by order source. Use "twap" to return only fills from TWAP child orders.
        schema:
          type: string
          enum:
          - twap
        example: twap
      - name: account_id
        in: query
        required: false
        description: Account ID for public (unauthenticated) queries
        schema:
          type: string
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fills:
                    type: array
                    items:
                      $ref: '#/components/schemas/FillHistoryEntry'
                  count:
                    type: integer
                    description: Number of fills returned
                    example: 50
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/leverage:
    post:
      tags:
      - Trading
      summary: Update leverage
      description: |
        Update the leverage for a specific symbol.

        **Note:** This affects new positions only. Existing positions are not modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeverageRequest'
      responses:
        '200':
          description: Leverage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeverageResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/marginMode:
    post:
      tags:
      - Trading
      summary: Update margin mode
      description: |
        Switch between cross and isolated margin mode.

        **Note:** Cannot change margin mode while a position is open for the symbol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarginModeRequest'
      responses:
        '200':
          description: Margin mode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginModeResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/isoMargin:
    post:
      tags:
      - Trading
      summary: Modify isolated margin
      description: |
        Add or remove margin from an isolated position.

        **Requirements:**
        - Position must exist and be in isolated margin mode
        - Cannot remove more margin than available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyMarginRequest'
      responses:
        '200':
          description: Margin modification submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyMarginResponse'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
