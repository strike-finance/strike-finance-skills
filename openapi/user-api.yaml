openapi: 3.0.3
info:
  title: Strike Perpetuals - User Data REST API
  description: Read-only endpoints for querying account state, positions, and history.
  version: 2.1.0
  contact:
    name: Strike Finance
    url: https://www.strikefinance.org
servers:
- url: https://api.strikefinance.org
  description: Mainnet
- url: https://api-v2-testnet.strikefinance.org
  description: Testnet
tags:
- name: Account
  description: Account info, balances, and portfolio
- name: Positions
  description: Open and closed position queries
- name: History
  description: Order, fill, funding, and transaction history
x-tagGroups:
- name: User Data
  tags:
  - Account
  - Positions
  - History
security:
- ApiWalletAuth: []
components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-API-Wallet-Public-Key
      description: |
        Ed25519 signature-based authentication using API Wallets.

        **Required Headers:**
        - `X-API-Wallet-Public-Key`: Your Ed25519 public key (64 hex characters)
        - `X-API-Wallet-Signature`: Ed25519 signature of the message (128 hex characters)
        - `X-API-Wallet-Timestamp`: Unix timestamp in seconds
        - `X-API-Wallet-Nonce`: Unique UUID v4 per request

        **Signature Message Format:**
        ```
        {METHOD}:{PATH}:{TIMESTAMP}:{NONCE}:{BODY_HASH}
        ```
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        msg:
          type: string
          description: Error message (alternative format)
      required:
      - error
    GetAccountResponse:
      type: object
      properties:
        account_id:
          type: string
          description: Unique account identifier
          example: 01234567-89ab-cdef-0123-456789abcdef
        blockchain:
          type: string
          description: Blockchain the account is registered on
          example: cardano
        blockchain_address:
          type: string
          description: On-chain wallet address
          example: addr1qx...
        wallet_balance:
          type: string
          description: Total wallet balance (USDT)
          example: '10000.00'
        available_balance:
          type: string
          description: Balance available for new orders
          example: '7500.00'
        unrealized_pnl:
          type: string
          description: Total unrealized PnL across all positions
          example: '250.50'
        margin_balance:
          type: string
          description: Wallet balance + unrealized PnL
          example: '10250.50'
        total_margin:
          type: string
          description: Total margin used
          example: '2500.00'
        position_initial_margin:
          type: string
          description: Initial margin held by open positions
          example: '2000.00'
        maintenance_margin:
          type: string
          description: Minimum margin required to avoid liquidation
          example: '500.00'
        symbol_settings:
          type: object
          description: Per-symbol trading settings (margin mode, leverage)
          additionalProperties:
            $ref: '#/components/schemas/SymbolSetting'
          example:
            BTC-USD:
              margin_mode: cross
              leverage: 10
              allow_pre_trade: false
            ETH-USD:
              margin_mode: isolated
              leverage: 20
              allow_pre_trade: false
    SymbolSetting:
      type: object
      properties:
        margin_mode:
          type: string
          enum:
          - cross
          - isolated
          description: Margin mode for this symbol
        leverage:
          type: integer
          description: Leverage multiplier
        allow_pre_trade:
          type: boolean
          description: Whether pre-trade is allowed
    BalanceResponse:
      type: object
      properties:
        asset:
          type: string
          description: Asset name
          example: USDT
        walletBalance:
          type: string
          description: Total wallet balance
          example: '10000.00'
        unrealizedPnl:
          type: string
          description: Unrealized PnL
          example: '250.50'
        marginBalance:
          type: string
          description: Wallet balance + unrealized PnL
          example: '10250.50'
        maintMargin:
          type: string
          description: Maintenance margin
          example: '500.00'
        initialMargin:
          type: string
          description: Total initial margin
          example: '2500.00'
        positionInitialMargin:
          type: string
          description: Initial margin held by positions
          example: '2000.00'
        openOrderInitialMargin:
          type: string
          description: Initial margin reserved by open orders
          example: '500.00'
        crossWalletBalance:
          type: string
          description: Cross-margin wallet balance
          example: '8000.00'
        crossUnPnl:
          type: string
          description: Cross-margin unrealized PnL
          example: '200.00'
        availableBalance:
          type: string
          description: Available balance for new orders
          example: '7500.00'
        maxWithdrawAmount:
          type: string
          description: Maximum amount available for withdrawal
          example: '7500.00'
        marginAvailable:
          type: boolean
          description: Whether margin is available
          example: true
        updateTime:
          type: integer
          format: int64
          description: Last update time (Unix ms)
          example: 1709123456789
    PortfolioSummaryResponse:
      type: object
      properties:
        account:
          type: object
          description: Account-level portfolio metrics
          properties:
            accountValue:
              type: string
              description: Total account value (balance + unrealized PnL)
              example: '10250.50'
            positionValue:
              type: string
              description: Total notional value of open positions
              example: '50000.00'
            availableBalance:
              type: string
              description: Balance available for new orders
              example: '7500.00'
            allTimePnl:
              type: string
              description: All-time cumulative PnL
              example: '1250.75'
            realizedPnl:
              type: string
              description: Realized PnL
              example: '1000.25'
            unrealizedPnl:
              type: string
              description: Unrealized PnL across all open positions
              example: '250.50'
            allTimeVolume:
              type: string
              description: All-time trading volume
              example: '500000.00'
            currentPositionSize:
              type: string
              description: Total current position size
              example: '0.5'
        volume:
          type: string
          description: Rolling 30-day trading volume
          example: '150000.00'
        fees:
          type: string
          description: Rolling 30-day fees paid
          example: '75.00'
        history:
          type: array
          description: |
            Equity history data points. Each entry is `[timestamp_ms, accountValue, realizedPnl, unrealizedPnl]`.
          items:
            type: array
            items:
              type: string
          example:
          - - '1709000000000'
            - '10000.00'
            - '800.00'
            - '200.00'
          - - '1709086400000'
            - '10250.50'
            - '1000.25'
            - '250.50'
        feeTier:
          type: integer
          description: Current fee tier index (0-based)
          example: 0
        feeTiers:
          type: array
          description: All available fee tier definitions
          items:
            $ref: '#/components/schemas/FeeTier'
        volume_history:
          type: array
          description: Daily volume breakdown
          items:
            $ref: '#/components/schemas/VolumeHistoryEntry'
        feeDiscountRate:
          type: number
          description: Current fee discount rate (percentage)
          example: 4
        isTradingEnabled:
          type: boolean
          description: Whether trading is currently enabled for this account
          example: true
    FeeTier:
      type: object
      properties:
        tier:
          type: integer
          description: Tier number
          example: 0
        min_volume:
          type: string
          description: Minimum 30-day volume to qualify
          example: '0'
        maker_fee:
          type: string
          description: Maker fee rate
          example: '0.0002'
        taker_fee:
          type: string
          description: Taker fee rate
          example: '0.0005'
    VolumeHistoryEntry:
      type: object
      properties:
        date:
          type: string
          description: Date (YYYY-MM-DD)
          example: '2024-01-15'
        exchange_volume:
          type: string
          description: Raw exchange volume for the day
          example: '50000.00'
        weighted_maker_volume:
          type: string
          description: Weighted maker volume
          example: '30000.00'
        weighted_taker_volume:
          type: string
          description: Weighted taker volume
          example: '20000.00'
    Position:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        PositionID:
          type: integer
          format: int64
          description: Position ID
          example: 1
        Side:
          type: string
          enum:
          - long
          - short
          - none
          description: Position side
          example: long
        Size:
          type: string
          description: Position size in base asset
          example: '0.5'
        EntryPrice:
          type: string
          description: Average entry price
          example: '50000.00'
        MarginMode:
          type: string
          enum:
          - cross
          - isolated
          description: Margin mode
          example: cross
        Leverage:
          type: integer
          description: Leverage multiplier
          example: 10
        IsolatedMargin:
          type: string
          description: Margin allocated (isolated mode only)
          example: '0'
        upnl:
          type: string
          description: Unrealized PnL
          example: '250.50'
        maintenance_margin:
          type: string
          description: Maintenance margin required
          example: '125.00'
        bankruptcy_price:
          type: string
          description: Price at which position equity reaches zero
          example: '45000.00'
        liquidation_price:
          type: string
          description: Price at which liquidation is triggered
          example: '45500.00'
    PositionsResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        count:
          type: integer
          description: Number of positions returned
          example: 2
    ClosedPosition:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        position_id:
          type: integer
          format: int64
          description: Position ID
          example: 1
        side:
          type: string
          enum:
          - long
          - short
          description: Position side
          example: long
        size:
          type: string
          description: Position size
          example: '0.5'
        entry_price:
          type: string
          description: Average entry price
          example: '50000.00'
        exit_price:
          type: string
          description: Average exit price
          example: '51000.00'
        realized_pnl:
          type: string
          description: Realized PnL from this position
          example: '500.00'
        margin_mode:
          type: string
          enum:
          - cross
          - isolated
          description: Margin mode used
        leverage:
          type: integer
          description: Leverage used
          example: 10
        opened_at:
          type: integer
          format: int64
          description: Position open time (Unix ms)
          example: 1709000000000
        closed_at:
          type: integer
          format: int64
          description: Position close time (Unix ms)
          example: 1709086400000
    ClosedPositionsResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/ClosedPosition'
        count:
          type: integer
          description: Number of closed positions returned
          example: 10
    OrderHistoryResult:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
          description: Order ID
          example: 123456
        client_order_id:
          type: string
          description: Client order ID
          example: my-order-001
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        side:
          type: string
          enum:
          - buy
          - sell
          description: Order side
          example: buy
        type:
          type: string
          description: Order type
          example: limit
        status:
          type: string
          enum:
          - pending
          - open
          - filled
          - canceled
          - untriggered
          - rejected
          - expired
          description: Order status
          example: filled
        price:
          type: string
          description: Order price
          example: '50000.00'
        size:
          type: string
          description: Order size
          example: '0.1'
        filled:
          type: string
          description: Filled quantity
          example: '0.1'
        created_at:
          type: integer
          format: int64
          description: Order creation time (Unix ms)
          example: 1709000000000
        updated_at:
          type: integer
          format: int64
          description: Last update time (Unix ms)
          example: 1709000001000
    OrderHistoryResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistoryResult'
        count:
          type: integer
          description: Number of orders returned
          example: 10
    FillHistoryResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Fill ID
          example: 789
        order_id:
          type: integer
          format: int64
          description: Associated order ID
          example: 123456
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        side:
          type: string
          enum:
          - buy
          - sell
          description: Trade side
          example: buy
        price:
          type: string
          description: Execution price
          example: '50000.00'
        qty:
          type: string
          description: Filled quantity
          example: '0.1'
        quote_qty:
          type: string
          description: Filled quote quantity (price * qty)
          example: '5000.00'
        commission:
          type: string
          description: Fee paid
          example: '2.50'
        commission_asset:
          type: string
          description: Fee asset
          example: USDT
        realized_pnl:
          type: string
          description: Realized PnL from this fill
          example: '0.00'
        is_maker:
          type: boolean
          description: Whether fill was a maker
          example: true
        time:
          type: integer
          format: int64
          description: Fill time (Unix ms)
          example: 1709000001000
        auto_close_type:
          type: string
          nullable: true
          enum:
          - liquidation
          - adl
          - bankrupt
          - if_transfer
          - null
          description: Auto-close type from the associated order. Null for regular trades.
          example: null
    FillHistoryResponse:
      type: object
      properties:
        fills:
          type: array
          items:
            $ref: '#/components/schemas/FillHistoryResult'
        count:
          type: integer
          description: Number of fills returned
          example: 10
    FundingHistoryResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Funding record ID
          example: 456
        symbol:
          type: string
          description: Trading pair
          example: BTC-USD
        income:
          type: string
          description: Funding income (positive = received, negative = paid)
          example: '-1.25'
        asset:
          type: string
          description: Asset
          example: USDT
        time:
          type: integer
          format: int64
          description: Funding time (Unix ms)
          example: 1709003600000
    FundingHistoryResponse:
      type: object
      properties:
        funding:
          type: array
          items:
            $ref: '#/components/schemas/FundingHistoryResult'
        count:
          type: integer
          description: Number of funding records returned
          example: 10
    TransactionHistoryResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Transaction ID
          example: 101
        type:
          type: string
          enum:
          - deposit
          - withdraw
          - fee
          - realized_pnl
          - liquidation
          description: Transaction type
          example: deposit
        status:
          type: string
          enum:
          - pending
          - completed
          - pending_settlement
          - settled
          - failed
          - cancelled
          description: Transaction status
          example: completed
        amount:
          type: string
          description: Transaction amount
          example: '5000.00'
        asset:
          type: string
          description: Asset
          example: USDT
        time:
          type: integer
          format: int64
          description: Transaction time (Unix ms)
          example: 1709000000000
    TransactionHistoryResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionHistoryResult'
        count:
          type: integer
          description: Number of transactions returned
          example: 10
  responses:
    MissingParameter:
      description: Missing required parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: MISSING_PARAMETER
            code: MISSING_PARAMETER
            msg: symbol parameter is required
    InvalidParameter:
      description: Invalid parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_PARAMETER
            code: INVALID_PARAMETER
            msg: invalid parameter
    Unauthorized:
      description: Unauthorized - missing or invalid API wallet authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_headers:
              summary: Missing authentication headers
              value:
                error: missing API wallet authentication headers
            invalid_signature:
              summary: Invalid or expired signature
              value:
                error: authentication failed
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
paths:
  /v2/account:
    get:
      tags:
      - Account
      summary: Get account info
      description: |
        Returns account information including balances, margins, and per-symbol trading settings (margin mode, leverage).

        Supports unauthenticated access when `vault_id` is provided — returns the vault's trading account data (with `blockchain` and `blockchain_address` omitted).
      parameters:
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault account queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/balances:
    get:
      tags:
      - Account
      summary: Get balances
      description: |
        Returns a detailed balance breakdown including wallet balance, margin allocations, unrealized PnL, and available balance.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault balance queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Balance details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/portfolio:
    get:
      tags:
      - Account
      summary: Get portfolio summary
      description: |
        Returns a comprehensive portfolio summary including account value, PnL breakdown, equity history chart data, fee tier information, and daily volume history.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault portfolio queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/positions:
    get:
      tags:
      - Positions
      summary: Get open positions
      description: |
        Returns all open positions with unrealized PnL, liquidation price, and maintenance margin calculations.

        Optionally filter by `symbol` or specific `position_id` (requires `symbol`).

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: position_id
        in: query
        required: false
        description: Filter by position ID (requires `symbol`)
        schema:
          type: string
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault position queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Open positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
              example:
                positions:
                - symbol: BTC-USD
                  PositionID: 1
                  Side: long
                  Size: '0.5'
                  EntryPrice: '50000.00'
                  MarginMode: cross
                  Leverage: 10
                  IsolatedMargin: '0'
                  upnl: '250.50'
                  maintenance_margin: '125.00'
                  bankruptcy_price: '45000.00'
                  liquidation_price: '45500.00'
                count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/closedPositions:
    get:
      tags:
      - Positions
      summary: Get closed positions
      description: |
        Returns closed positions with realized PnL. Supports time-range filtering and pagination.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Closed positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPositionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/history/order:
    get:
      tags:
      - History
      summary: Get order history
      description: |
        Returns historical orders with filtering by symbol, status, time range, and order ID. Supports cursor-based pagination via `fromOrderID`.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: status
        in: query
        required: false
        description: |
          Filter by order status (integer enum): `2` = open, `3` = filled, `4` = canceled, `5` = untriggered, `6` = rejected, `7` = expired
        schema:
          type: integer
      - name: order_id
        in: query
        required: false
        description: Filter by specific order ID
        schema:
          type: integer
          format: int64
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: fromOrderID
        in: query
        required: false
        description: Pagination cursor — return orders with ID greater than this value
        schema:
          type: integer
          format: int64
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/history/fill:
    get:
      tags:
      - History
      summary: Get fill history
      description: |
        Returns trade fill history. Each fill represents a partial or full execution of an order. Supports filtering by symbol, order ID, and time range. Cursor-based pagination via `fromId` (backward) or `since_trade_id` (forward).

        Use `since_trade_id` to poll for new fills after a known trade ID. Results are returned in ascending `trade_id` order. Cannot be combined with `fromId`.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: order_id
        in: query
        required: false
        description: Filter fills for a specific order
        schema:
          type: integer
          format: int64
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      - name: fromId
        in: query
        required: false
        description: Backward pagination cursor — return fills with internal ID less than this value (newest
          first)
        schema:
          type: integer
          format: int64
      - name: since_trade_id
        in: query
        required: false
        description: Forward cursor — return fills with trade_id greater than this value, ordered ascending.
          Use for polling new fills. Cannot be combined with fromId.
        schema:
          type: integer
          format: int64
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Fill history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/history/funding:
    get:
      tags:
      - History
      summary: Get funding payment history
      description: |
        Returns funding payment history. Positive income means the account received funding; negative means it paid. Supports filtering by symbol and time range. Cursor-based pagination via `fromId`.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: symbol
        in: query
        required: false
        description: Filter by trading pair symbol
        schema:
          type: string
        example: BTC-USD
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      - name: fromId
        in: query
        required: false
        description: Pagination cursor — return records with ID greater than this value
        schema:
          type: integer
          format: int64
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Funding payment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/history/transaction:
    get:
      tags:
      - History
      summary: Get transaction history
      description: |
        Returns transaction history including deposits, withdrawals, fees, realized PnL, and liquidations. Supports filtering by type, status, and time range. Cursor-based pagination via `fromId`.

        Supports unauthenticated access when `vault_id` is provided.
      parameters:
      - name: type
        in: query
        required: false
        description: |
          Filter by transaction type. Accepts comma-separated integers or repeated query params. `1` = deposit, `2` = withdraw, `3` = fee, `4` = realized_pnl, `5` = liquidation. String values (`deposit`, `withdraw`, `fee`, `realized_pnl`, `liquidation`) are also accepted.
        schema:
          type: string
        example: 1,2
      - name: status
        in: query
        required: false
        description: |
          Filter by status (integer enum): `1` = pending, `2` = completed, `3` = pending_settlement, `4` = settled, `5` = failed, `6` = cancelled
        schema:
          type: integer
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: fromId
        in: query
        required: false
        description: Pagination cursor — return transactions with ID greater than this value
        schema:
          type: integer
          format: int64
      - name: vault_id
        in: query
        required: false
        description: Vault ID for public vault queries (no authentication required when provided)
        schema:
          type: string
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
