openapi: 3.0.3
info:
  title: Strike Market Data API
  description: |
    Public market-data endpoints served by the Price Service.
    Base path: `/v2`
  version: 2.0.0
  contact:
    name: Strike Finance
    url: https://www.strikefinance.org
servers:
- url: https://api.strikefinance.org/price
  description: Mainnet
- url: https://api-v2-testnet.strikefinance.org/price
  description: Testnet
tags:
- name: Order Book
  description: Order book depth snapshots
- name: Trades
  description: Recent trade data
- name: Prices
  description: Mark price, index price, and funding rate
- name: Ticker
  description: Rolling statistics, latest price, and best bid/ask
- name: Exchange Info
  description: Trading rules and symbol information
- name: Klines
  description: Candlestick / kline chart data
- name: Open Interest
  description: Open interest data
x-tagGroups:
- name: Market
  tags:
  - Order Book
  - Trades
  - Prices
  - Ticker
  - Exchange Info
  - Klines
  - Open Interest
paths:
  /v2/depth:
    get:
      tags:
      - Order Book
      summary: Order Book Depth
      description: |
        Returns a snapshot of the current order book for a given symbol.

        ### Field semantics

        | Field          | Type     | Description |
        |----------------|----------|-------------|
        | `lastUpdateId` | uint64   | Monotonically increasing sequence ID assigned by the matching engine (`ctx.SequenceID`). This is a **real update ID**, not a placeholder or timestamp. |
        | `E`            | int64    | Snapshot event time — Unix milliseconds when the matching engine produced the snapshot. |
        | `T`            | int64    | Transaction time — same value as `E` for this endpoint. Represents when the orderbook state was captured, **not** the server response time. |
        | `bids`         | string[][] | Bid levels sorted best (highest) first. Each entry is `[price, quantity]`. |
        | `asks`         | string[][] | Ask levels sorted best (lowest) first. Each entry is `[price, quantity]`. |

        ### Synchronising a local order book with WebSocket

        1. **Initialise** — fetch this endpoint and record `lastUpdateId`.
        2. **Connect** to the WebSocket stream `{symbol}@depth`.
        3. **Drop** any WS `depthUpdate` event where `u <= lastUpdateId`.
        4. **Apply** all subsequent events to update your local book.

        > **Important:** per-symbol `+1` continuity between consecutive `u` values
        > is **not** guaranteed — the engine may skip IDs when no book change occurs.
        > Do **not** treat a gap as a missed update.

        ### JS / TS consumers

        `lastUpdateId` (and the WS fields `U` / `u`) can exceed `Number.MAX_SAFE_INTEGER`.
        Always parse them with a BigInt-safe method:

        ```ts
        // When parsing the REST response
        const data = JSON.parse(text, (key, value) => {
          if (key === "lastUpdateId") return BigInt(value);
          return value;
        });

        // When parsing WS depthUpdate messages
        const msg = JSON.parse(text, (key, value) => {
          if (key === "U" || key === "u") return BigInt(value);
          return value;
        });
        ```

        ### Caching

        Responses are cached server-side for **5 seconds** (short-TTL).
        The `X-Cache` response header indicates `HIT` or `MISS`.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USDT
        description: Trading pair symbol.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        description: |
          Maximum number of bid/ask levels to return (each side).
          Clamped to 1000.
      responses:
        '200':
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
              example:
                lastUpdateId: 1027024
                E: 1700000000000
                T: 1700000000000
                bids:
                - - '43250.10'
                  - '0.500'
                - - '43250.00'
                  - '1.200'
                asks:
                - - '43250.20'
                  - '0.300'
                - - '43251.00'
                  - '2.100'
        '400':
          description: Missing or invalid symbol
          content:
            application/json:
              example:
                code: MISSING_PARAMETER
                msg: symbol parameter is required
        '500':
          description: Internal error
          content:
            application/json:
              example:
                code: INTERNAL_ERROR
                msg: failed to retrieve orderbook
  /v2/trades:
    get:
      tags:
      - Trades
      summary: Recent Trades
      description: Returns the most recent trades for a symbol.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USDT
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Number of trades to return. Clamped to 1000.
      responses:
        '200':
          description: List of recent trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeResponse'
              example:
              - id: 12345
                price: '43250.10'
                qty: '0.500'
                quoteQty: '21625.05'
                time: 1700000000000
                isBuyerMaker: false
  /v2/premiumIndex:
    get:
      tags:
      - Prices
      summary: Mark Price / Funding Rate
      description: |
        Returns mark price, index price, and funding rate information.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USDT
      responses:
        '200':
          description: Premium index data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumIndexResponse'
  /v2/markPrice:
    get:
      tags:
      - Prices
      summary: Mark Price
      description: |
        Returns the current mark price snapshot (same shape as the WS `markPriceUpdate` event).
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Mark price snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkPriceResponse'
              example:
                e: markPriceUpdate
                E: 1700000000000
                s: BTC-USD
                p: '43250.10'
                i: '43240.50'
                P: '43245.00'
                r: '0.0001'
                T: 1700003600000
        '400':
          description: Invalid symbol
          content:
            application/json:
              example:
                code: INVALID_SYMBOL
                msg: symbol not found
  /v2/indexPrice:
    get:
      tags:
      - Prices
      summary: Index Price
      description: |
        Returns the current index price snapshot.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Index price snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexPriceResponse'
              example:
                e: indexPriceUpdate
                E: 1700000000000
                s: BTC-USD
                p: '43240.50'
        '400':
          description: Invalid symbol
          content:
            application/json:
              example:
                code: INVALID_SYMBOL
                msg: symbol not found
  /v2/ticker/24hr:
    get:
      tags:
      - Ticker
      summary: 24hr Ticker Statistics
      description: |
        Returns 24-hour rolling window price change statistics.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USDT
      responses:
        '200':
          description: 24hr ticker data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24hrResponse'
  /v2/ticker/price:
    get:
      tags:
      - Ticker
      summary: Latest Price
      description: |
        Returns the latest price for a symbol.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USDT
      responses:
        '200':
          description: Latest price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerPriceResponse'
  /v2/ticker/bookTicker:
    get:
      tags:
      - Ticker
      summary: Best Bid / Ask
      description: |
        Returns best bid and ask prices and quantities.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USDT
      responses:
        '200':
          description: Book ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTickerResponse'
  /v2/exchangeInfo:
    get:
      tags:
      - Exchange Info
      summary: Exchange Information
      description: Returns trading rules and symbol information for all listed markets.
      responses:
        '200':
          description: Exchange info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeInfoResponse'
  /v2/klines:
    get:
      tags:
      - Klines
      summary: Kline / Candlestick Data
      description: |
        Returns candlestick (OHLCV) bars for a symbol.

        Data is assembled from a cold store (PostgreSQL) and a hot store (Redis).
        Missing candles between data points are gap-filled with the previous close price and zero volume.

        ### Price types

        | `priceType` | Description |
        |-------------|-------------|
        | `last`      | Last traded price (default). |
        | `mark`      | Mark price — volume is overlaid from `last` klines. |
        | `index`     | Index price — volume is overlaid from `last` klines. |

        ### Response format

        Each element is a JSON array (Binance-compatible):

        | Index | Field           | Type   |
        |-------|-----------------|--------|
        | 0     | openTime        | int64  |
        | 1     | open            | string |
        | 2     | high            | string |
        | 3     | low             | string |
        | 4     | close           | string |
        | 5     | volume          | string |
        | 6     | closeTime       | int64  |
        | 7     | quoteVolume     | string |
        | 8     | trades          | int64  |
        | 9     | takerBuyBase    | string |
        | 10    | takerBuyQuote   | string |
        | 11    | (unused)        | string |

        ### Caching

        Responses are cached server-side for **5 seconds** (short-TTL).
        The `X-Cache` response header indicates `HIT` or `MISS`.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USDT
        description: Trading pair symbol.
      - name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 3m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 6h
          - 8h
          - 12h
          - 1d
          - 3d
          - 1w
          - 1M
        description: Kline interval.
      - name: startTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Start time in Unix milliseconds (inclusive). Omit to let the server choose.
      - name: endTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: End time in Unix milliseconds (inclusive). Omit to return up to the latest candle.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 500
        description: Maximum number of candles to return. Clamped to 1500.
      - name: priceType
        in: query
        required: false
        schema:
          type: string
          enum:
          - last
          - mark
          - index
          default: last
        description: |
          Price series to use.
          `mark` and `index` klines overlay volume from `last` klines.
      responses:
        '200':
          description: Array of kline bars
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items: {}
                  minItems: 12
                  maxItems: 12
                description: 'Each element is a 12-element array: [openTime, open, high, low, close, volume,
                  closeTime, quoteVolume, trades, takerBuyBase, takerBuyQuote, "0"].'
              example:
              - - 1700000000000
                - '43250.10'
                - '43300.00'
                - '43200.50'
                - '43280.00'
                - '125.340'
                - 1700000059999
                - '5421750.00'
                - 312
                - '62.170'
                - '2690125.00'
                - '0'
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: MISSING_PARAMETER
                  msg:
                    type: string
                    example: symbol parameter is required
  /v2/openInterest:
    get:
      tags:
      - Open Interest
      summary: Open Interest
      description: |
        Returns current open interest in base-asset units.
        Omit `symbol` to return all symbols.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTCUSD
      responses:
        '200':
          description: Open interest data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenInterestResponse'
components:
  schemas:
    OrderBookResponse:
      type: object
      properties:
        lastUpdateId:
          type: integer
          format: uint64
          description: Engine sequence ID. Monotonically increasing, **not** a timestamp.
        E:
          type: integer
          format: int64
          description: Snapshot event time (Unix ms).
        T:
          type: integer
          format: int64
          description: Transaction time (Unix ms). Same value as `E` on this endpoint.
        bids:
          type: array
          items:
            type: array
            items:
              type: string
          description: 'Bid levels, best first. Each entry: `[price, quantity]`.'
        asks:
          type: array
          items:
            type: array
            items:
              type: string
          description: 'Ask levels, best first. Each entry: `[price, quantity]`.'
    TradeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        price:
          type: string
        qty:
          type: string
        quoteQty:
          type: string
        time:
          type: integer
          format: int64
          description: Trade timestamp (Unix ms).
        isBuyerMaker:
          type: boolean
    PremiumIndexResponse:
      type: object
      properties:
        symbol:
          type: string
        markPrice:
          type: string
        indexPrice:
          type: string
        estimatedSettlePrice:
          type: string
        lastFundingRate:
          type: string
        nextFundingTime:
          type: integer
          format: int64
        interestRate:
          type: string
        time:
          type: integer
          format: int64
    Ticker24hrResponse:
      type: object
      properties:
        symbol:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        weightedAvgPrice:
          type: string
        lastPrice:
          type: string
        lastQty:
          type: string
        openPrice:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
        quoteVolume:
          type: string
        openTime:
          type: integer
          format: int64
        closeTime:
          type: integer
          format: int64
        firstId:
          type: integer
          format: int64
        lastId:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    TickerPriceResponse:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: string
        time:
          type: integer
          format: int64
    BookTickerResponse:
      type: object
      properties:
        symbol:
          type: string
        bidPrice:
          type: string
        bidQty:
          type: string
        askPrice:
          type: string
        askQty:
          type: string
        time:
          type: integer
          format: int64
    ExchangeInfoResponse:
      type: object
      properties:
        timezone:
          type: string
        serverTime:
          type: integer
          format: int64
        rateLimits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/SymbolInfo'
    RateLimit:
      type: object
      properties:
        rateLimitType:
          type: string
        interval:
          type: string
        intervalNum:
          type: integer
        limit:
          type: integer
    SymbolInfo:
      type: object
      properties:
        symbol:
          type: string
        pair:
          type: string
        contractType:
          type: string
          example: PERPETUAL
        status:
          type: string
        baseAsset:
          type: string
        quoteAsset:
          type: string
        marginAsset:
          type: string
        pricePrecision:
          type: integer
        quantityPrecision:
          type: integer
        baseAssetPrecision:
          type: integer
        quotePrecision:
          type: integer
        underlyingType:
          type: string
        underlyingSubType:
          type: array
          items:
            type: string
        settlePlan:
          type: integer
        triggerProtect:
          type: string
        liquidationFee:
          type: string
        limitTakeBound:
          type: string
        marketTakeBound:
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterInfo'
        orderType:
          type: array
          items:
            type: string
        timeInForce:
          type: array
          items:
            type: string
    FilterInfo:
      type: object
      properties:
        filterType:
          type: string
        maxPrice:
          type: string
        minPrice:
          type: string
        tickSize:
          type: string
        maxQty:
          type: string
        minQty:
          type: string
        stepSize:
          type: string
        limit:
          type: integer
        notional:
          type: string
        multiplierUp:
          type: string
        multiplierDown:
          type: string
        multiplierDecimal:
          type: string
    MarkPriceResponse:
      type: object
      properties:
        e:
          type: string
          description: Event type (`markPriceUpdate`).
        E:
          type: integer
          format: int64
          description: Event time (Unix ms).
        s:
          type: string
          description: Symbol.
        p:
          type: string
          description: Mark price.
        i:
          type: string
          description: Index price.
        P:
          type: string
          description: Estimated settle price.
        r:
          type: string
          description: Funding rate.
        T:
          type: integer
          format: int64
          description: Next funding time (Unix ms).
    IndexPriceResponse:
      type: object
      properties:
        e:
          type: string
          description: Event type (`indexPriceUpdate`).
        E:
          type: integer
          format: int64
          description: Event time (Unix ms).
        s:
          type: string
          description: Symbol.
        p:
          type: string
          description: Index price.
    OpenInterestResponse:
      type: object
      properties:
        symbol:
          type: string
        openInterest:
          type: string
          description: Open interest in base-asset units.
        time:
          type: integer
          format: int64
