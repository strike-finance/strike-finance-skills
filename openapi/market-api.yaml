openapi: 3.0.3
info:
  title: Strike Market Data API
  description: |
    Public market-data endpoints served by the Price Service. No authentication.

    Public base URL: `https://<host>/price` (the gateway strips `/price` before the
    request reaches the service), so every path below is called as
    `https://<host>/price/v2/...`, e.g. `https://api.strikefinance.org/price/v2/depth`.

    Conventions:
    - Send the canonical market symbol, e.g. `BTC-USD`. Most endpoints are
      case-sensitive (a lowercase symbol gives `400 INVALID_SYMBOL`, or an empty
      result on `/v2/depth` and `/v2/trades`); `/v2/markPrice` and `/v2/indexPrice`
      also accept lowercase, and `/v2/sparklines` upper-cases its filter.
    - Prices, sizes and rates are decimal strings; times are Unix milliseconds (numbers).
    - Errors are `{"code": "...", "msg": "..."}` (`MISSING_PARAMETER`, `INVALID_PARAMETER`,
      `INVALID_SYMBOL`, `INTERNAL_ERROR`, `SERVICE_UNAVAILABLE`), except
      `/v2/marketStats` (400 and 500) and `/v2/sparklines` (500), which return
      `{"error": "..."}`.
    - Endpoints served from the in-process short-TTL cache (about 5 s) set
      `X-Cache: HIT|MISS`.
    - Do not hard-code market lists: `GET https://<host>/v2/markets` (API host, no
      `/price`) lists every market with its `asset_class` and `tags`;
      `/v2/exchangeInfo` and `/v2/fundingInfo` also enumerate markets.

    Real-time streams are on the public price WebSocket `wss://<host>/ws/price`
    (see the strike-price-feeds skill). The L3 market-by-order feed is a separate
    service: `GET https://<host>/v2/l3/snapshot` (documented below with its own
    `servers`, no `/price` prefix) and `wss://<host>/ws/l3`.
  version: 2.1.0
  contact:
    name: Strike Finance
    url: https://www.strikefinance.org
servers:
- url: https://api.strikefinance.org/price
  description: Mainnet (paths below are appended, e.g. /price/v2/depth)
- url: https://api-v2-testnet.strikefinance.org/price
  description: Testnet (paths below are appended, e.g. /price/v2/depth)
tags:
- name: Order Book
  description: Order book depth snapshots
- name: Trades
  description: Recent public trades
- name: Prices
  description: Mark price, index price, premium index and funding
- name: Ticker
  description: 24h statistics, latest price, best bid/ask
- name: Market Stats
  description: Per-market metadata plus live stats, and the sentiment index
- name: Exchange Info
  description: Trading rules and symbol information
- name: Klines
  description: Candlestick data and compact sparkline series
- name: Open Interest
  description: Open interest
- name: Reference Rates
  description: Stablecoin and fiat reference rates (display only)
- name: L3
  description: Market-by-order snapshot (separate L3 service, served without the /price prefix)
x-tagGroups:
- name: Market
  tags:
  - Order Book
  - Trades
  - Prices
  - Ticker
  - Market Stats
  - Exchange Info
  - Klines
  - Open Interest
  - Reference Rates
  - L3
paths:
  /v2/depth:
    get:
      tags:
      - Order Book
      summary: Order Book Depth
      description: |
        Returns the full book the WebSocket `<symbol>@depth` stream last published
        (not cached, no `X-Cache` header).

        | Field          | Type       | Description |
        |----------------|------------|-------------|
        | `lastUpdateId` | uint64     | The `u` of the last `depthUpdate` published for the symbol; the next one has `pu` equal to this. `0` when nothing has been published for the symbol (or it is unknown). |
        | `E`            | int64      | Response time (ms). |
        | `T`            | int64      | Matching-engine time of this book (ms); the response time when nothing has been published. |
        | `bids`         | string[][] | `[price, quantity]`, best (highest) first. |
        | `asks`         | string[][] | `[price, quantity]`, best (lowest) first. |

        No level has a zero size. An unknown symbol returns `200` with
        `lastUpdateId: 0` and empty `bids`/`asks`. A side that returns fewer than
        `limit` levels is complete.

        ### Using it with the WebSocket `<symbol>@depth` stream

        The stream carries diffs of the **whole book** (absolute sizes; `"0"` removes
        the level), each with `pu` = the previous message's `u`. Subscribe and buffer,
        fetch this endpoint, drop buffered events with `u <= lastUpdateId`; the first
        remaining event must have `pu == lastUpdateId` and each later one `pu ==` the
        previous `u`. On any `pu` mismatch or reconnect, fetch this endpoint again.
        `U` need not be `pu + 1`. In WS messages `b`/`a` is `null` when that side did
        not change (this REST response always returns arrays).
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USD
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 65534
          default: 1000
        description: Levels per side. Values above 65534 are clamped; missing, non-numeric or <= 0 uses 1000.
      responses:
        '200':
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
              example:
                lastUpdateId: 93450741
                E: 1792438776570
                T: 1792432626597
                bids:
                - - '82.55'
                  - '1.82'
                - - '82.5'
                  - '2.43'
                asks:
                - - '82.67'
                  - '39.31'
                - - '82.78'
                  - '50'
        '400':
          description: Missing symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MISSING_PARAMETER
                msg: symbol parameter is required
        '500':
          description: Snapshot read or decode failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                readFailed:
                  value:
                    code: INTERNAL_ERROR
                    msg: failed to retrieve orderbook
                decodeFailed:
                  value:
                    code: INTERNAL_ERROR
                    msg: failed to decode orderbook snapshot
  /v2/trades:
    get:
      tags:
      - Trades
      summary: Recent Trades
      description: |
        Returns the most recent public trades for a symbol, **newest first**. The
        server keeps the latest 1000 trades per symbol; there is no older paging on
        this endpoint. Unknown symbols return `[]`. Cached about 5 s (`X-Cache`),
        except requests with `fromSeq`.

        - `id` is exchange-wide (shared by every market), so one market's IDs increase
          but skip; an ID gap is not a missed trade.
        - `seq` is the trade's number on its market, +1 per trade, the same value as
          `seq` on the WS `<symbol>@trade` stream. It never goes back or restarts.
          Absent for a moment on a trade the stream has not published yet.
        - Refill a gap: `fromSeq` = last `seq` received + 1, then the highest `seq`
          returned + 1, until the response is empty. Drop duplicates by `seq`.
        - `order_type`: `fill`, `liquidation` (taker was a position being liquidated
          on the book) or `adl` (auto-deleveraging at a settlement price, off the book;
          the force-closed side is the taker). ADL trades are listed and numbered but
          left out of candles, last price and 24h volume.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USD
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Number of trades. Clamped to 1000; non-numeric or <= 0 falls back to 100.
      - name: fromSeq
        in: query
        required: false
        schema:
          type: integer
          format: uint64
          minimum: 0
        example: 812
        description: Return the oldest `limit` trades with `seq >= fromSeq` (still newest first). Trades without a `seq` are not returned. Not cached.
      responses:
        '200':
          description: Recent trades, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeResponse'
              example:
              - id: 18071
                seq: 812
                price: '77117.60'
                qty: '0.0099'
                quoteQty: '763.464240'
                time: 1792172831028
                isBuyerMaker: true
                order_type: fill
        '400':
          description: Missing symbol or invalid `fromSeq`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingSymbol:
                  value:
                    code: MISSING_PARAMETER
                    msg: symbol parameter is required
                badFromSeq:
                  value:
                    code: INVALID_PARAMETER
                    msg: fromSeq must be a non-negative integer
  /v2/premiumIndex:
    get:
      tags:
      - Prices
      summary: Premium Index / Funding Window
      description: |
        Committed mark and index prices plus statistics of the active funding window.
        With `symbol` returns one object; without it returns an array for all symbols
        (sorted by symbol).

        Funding is hourly: the active window is the current UTC hour and
        `nextFundingTime` is its end. Premium-index samples are taken nominally every
        5 s; `averagePremiumIndex` is duration-weighted. At the start of each window
        both premium values are `"0"` and `premiumIndexCount` is `0`, and
        `fundingRate` (the live **hourly** estimate, same as WS `r`) is the
        interest-only baseline until samples accumulate. `interestRate`,
        `interestRateDampener` (8-hour basis) and `fundingMultiplier` are the active
        per-market funding parameters; the 8-hour rate is clamped to the market's
        floor/cap and divided by 8 (see `/v2/fundingInfo`).
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Premium index data (object for one symbol, array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PremiumIndexResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/PremiumIndexResponse'
              example:
                symbol: BTC-USD
                markPrice: '81649.00853590'
                indexPrice: '81885.03705489'
                latestPremiumIndex: '0'
                averagePremiumIndex: '0'
                premiumIndexCount: 0
                fundingRate: '0.0000125'
                nextFundingTime: 1792440000000
                interestRate: '0.0001'
                interestRateDampener: '0.0005'
                fundingMultiplier: '1'
                time: 1792438625706
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
        '503':
          description: Price engine still initializing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                msg: price engine is initializing
  /v2/fundingInfo:
    get:
      tags:
      - Prices
      summary: Funding Interval and Limits
      description: |
        Each market's funding interval and the cap and floor on its funding rate, as
        used by the running price engine. With `symbol` returns one object; without
        it returns an array for every market, sorted by symbol.

        Funding is paid every hour. `fundingRateCap` and `fundingRateFloor` are per
        funding interval (hourly), the same unit as `fundingRate` on
        `/v2/premiumIndex` and `r` on the mark-price stream: the market's 8-hour
        bounds divided by 8. A changed setting is reflected after the price engine
        restarts.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Funding info (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FundingInfoResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/FundingInfoResponse'
              example:
                symbol: BTC-USD
                fundingIntervalHours: 1
                fundingRateCap: '0.005'
                fundingRateFloor: '-0.005'
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
        '500':
          description: Invalid running funding setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                msg: failed to retrieve funding info
        '503':
          description: Price engine still initializing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                msg: price engine is initializing
  /v2/markPrice:
    get:
      tags:
      - Prices
      summary: Mark Price
      description: |
        Current mark-price snapshot, same shape as the WS `markPriceUpdate` event
        without its `stream` field. With `symbol` returns one object (cached about
        5 s, `X-Cache`); without it returns an array for all symbols (possibly `[]`).
        `r` is the live hourly funding-rate estimate for the current window and `T`
        the time that window settles.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Mark price snapshot (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MarkPriceResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/MarkPriceResponse'
              example:
                e: markPriceUpdate
                E: 1792438629661
                s: BTC-USD
                p: '81649.00853590'
                i: '81886.56143616'
                r: '0.0000125'
                T: 1792440000000
        '400':
          description: No mark price data for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: no mark price data available for symbol
  /v2/indexPrice:
    get:
      tags:
      - Prices
      summary: Index Price
      description: |
        Current index-price snapshot. With `symbol` returns one object (cached about
        5 s, `X-Cache`); without it returns an array for all symbols (possibly `[]`).
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Index price snapshot (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IndexPriceResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/IndexPriceResponse'
              example:
                e: indexPriceUpdate
                E: 1792438630601
                s: BTC-USD
                p: '81885.90564570'
        '400':
          description: No index price data for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: no index price data available for symbol
  /v2/ticker/24hr:
    get:
      tags:
      - Ticker
      summary: 24hr Ticker Statistics
      description: |
        Rolling 24h statistics built from 1m last-price candles (ADL trades are not
        counted). With `symbol` returns
        one object (cached about 5 s, `X-Cache`); without it returns an array of only
        the markets that have 24h candle data. A single-symbol request for a market
        without 24h data (or an all-markets request when no market has data) falls
        back to the last price with zero change and zero volume.

        `weightedAvgPrice` is the last price (approximation), `lastQty` is `"0"`, and
        `firstId`, `lastId`, `count` are always `0`. `openTime` is now minus 24h and
        `closeTime` is now.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: 24hr ticker (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Ticker24hrResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/Ticker24hrResponse'
              example:
                symbol: BTC-USD
                priceChange: '-2862.40'
                priceChangePercent: '-3.578894723680920230'
                weightedAvgPrice: '77117.60'
                lastPrice: '77117.60'
                lastQty: '0'
                openPrice: '79980'
                highPrice: '79980'
                lowPrice: '77117.60'
                volume: '0.0099'
                quoteVolume: '763.464240'
                openTime: 1792352226669
                closeTime: 1792438626669
                firstId: 0
                lastId: 0
                count: 0
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
  /v2/ticker/price:
    get:
      tags:
      - Ticker
      summary: Latest Price
      description: |
        Last traded price from the market record. With `symbol` returns one object;
        without it returns an array. `time` is the server response time.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Latest price (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TickerPriceResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/TickerPriceResponse'
              example:
                symbol: BTC-USD
                price: '77117.60'
                time: 1792438627626
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
  /v2/ticker/bookTicker:
    get:
      tags:
      - Ticker
      summary: Best Bid / Ask
      description: |
        Best bid/ask price and size from the market record. With `symbol` returns
        one object; without it returns an array. `time` is the server response time.
        For a push stream use WS `<symbol>@bookticker`.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Book ticker (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BookTickerResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/BookTickerResponse'
              example:
                symbol: BTC-USD
                bidPrice: '77117.60'
                bidQty: '0.0099'
                askPrice: '80000'
                askQty: '0.1'
                time: 1792438628708
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
  /v2/marketStats:
    get:
      tags:
      - Market Stats
      summary: Market Stats
      description: |
        Market metadata and live stats for every market (sorted by symbol), or one
        market with `symbol` (exact match). Not cached.

        - `status`: `ACTIVE` (trading), `PRE_TRADING`, `BREAK`, `CLOSED`; `active` and
          `visibleOnUI` are true only for trading markets.
        - `category`/`subCategory`: `Crypto`/`""`, or `TradFi` with `FX`, `Commodity`,
          `Equity` or `Index`, derived from the market's `asset_class` (the value
          `GET /v2/markets` serves with `tags` for finer grouping).
        - `collateralAssetName`: the symbol suffix after `-` (e.g. `USD`).
        - `marketStats.volume24h` is quote volume, `volumeBase24h` base volume.
        - `marketStats.nextFundingRate` is the **next funding time** in ms (name kept for compatibility).
        - `marketStats.openInterestBase` is one-sided open interest in base units (the
          same figure as `/v2/openInterest`); `openInterest` is that value x mark price.
        - `createdAt` is Unix ms (`0` when unset).
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Market stats envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatsResponse'
              example:
                status: OK
                data:
                - symbol: BTC-USD
                  type: PERPETUAL
                  category: Crypto
                  subCategory: ''
                  assetName: BTC
                  collateralAssetName: USD
                  active: true
                  status: ACTIVE
                  marketStats:
                    volume24h: '0'
                    volumeBase24h: '0'
                    priceChange24h: '0'
                    priceChangePercentage24h: '0'
                    low24h: '77117.60'
                    high24h: '77117.60'
                    lastPrice: '77117.60'
                    markPrice: '81649.00853590'
                    indexPrice: '81885.93170330'
                    fundingRate: '0.0000125'
                    nextFundingRate: 1792440000000
                    openInterest: '1644224.872173564148'
                    openInterestBase: '20.13772000000000000'
                  visibleOnUI: true
                  createdAt: 0
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              example:
                error: invalid symbol
        '500':
          description: Market read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              example:
                error: failed to retrieve markets
  /v2/fearGreed:
    get:
      tags:
      - Market Stats
      summary: Fear & Greed Index
      description: |
        Display-only sentiment index (0 = extreme fear, 100 = extreme greed) computed
        from this exchange's 24h tape and recomputed every 30 s. Sent with
        `Cache-Control: public, max-age=30`. Not a trading or risk input.

        Classification bands: `< 25` Extreme Fear, `< 45` Fear, `< 55` Neutral,
        `< 75` Greed, otherwise Extreme Greed. `components` are 0-100 sub-scores
        (floats rounded to 2 decimals; weights: momentum 0.50, breadth 0.35,
        volatility 0.15).
      responses:
        '200':
          description: Current reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FearGreedResponse'
              example:
                status: OK
                data:
                  value: 40
                  classification: Fear
                  timestamp: 1792438627808
                  components:
                    momentum: 50
                    breadth: 0
                    volatility: 100
                  marketsCounted: 1
        '503':
          description: No reading computed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                msg: fear and greed index is not available yet
  /v2/exchangeInfo:
    get:
      tags:
      - Exchange Info
      summary: Exchange Information
      description: |
        Trading rules for all markets. The response is rebuilt from the market
        configs every 2 s in the background and served from that cache (`X-Cache`),
        so `serverTime` is when the cached copy was built (up to ~2 s old), not a
        clock. `rateLimits` and `orderType` are static lists; `timeInForce` lists the
        engine's time-in-force values (`GTC`, `IOC`, `ALO`). `quoteAsset` and
        `marginAsset` are the symbol suffix (`BTC-USD` -> `USD`). `status` is the
        lowercase market status (`pre_trading`, `trading`, `break`, `close`).

        Filters per symbol: `PRICE_FILTER` (`minPrice`, `maxPrice`, `tickSize`),
        `LOT_SIZE` (limit orders: `minQty`, `maxQty`, `stepSize`), `MARKET_LOT_SIZE`
        (market orders: `minQty`, `maxQty`, `stepSize`), `MIN_NOTIONAL` (`notional`).
      responses:
        '200':
          description: Exchange info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeInfoResponse'
        '500':
          description: Market read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                msg: failed to retrieve exchange information
  /v2/klines:
    get:
      tags:
      - Klines
      summary: Kline / Candlestick Data
      description: |
        Candles merged from PostgreSQL (closed history) and Redis (recent and the
        in-progress candle). Candles are UTC-aligned (`1w` opens Monday 00:00 UTC,
        `1M` on the 1st, `3d` in day-of-year blocks of 3 that restart each year; the
        last `3d` block of a year has a `closeTime` past 1 January while the next block
        opens on 1 January).

        ### Window selection
        - No `startTime`/`endTime`: the newest `limit` candles, ending at the newest
          stored candle (plus the in-progress candle if it exists). Not forward-filled to now.
        - `endTime` set (with or without `startTime`): the newest `limit` candles with
          open time <= `endTime`, gap-filled forward up to `endTime`. Tail-anchored:
          `startTime` is not a reliable lower bound here, so rows with
          `openTime < startTime` can appear; drop them if you need a strict bound.
        - Only `startTime` set: the first `limit` candles from `startTime` forward. If
          that window is empty, the last candle before `startTime` is returned as a
          seed, so a row with `openTime < startTime` may appear.

        ### Gap filling and continuity
        Missing periods between candles are filled with flat candles at the previous
        close and zero volume. Nothing is synthesized before the market's first candle
        (a `startTime` before listing returns rows from the first candle).
        For `last`, each closed candle's `open` is set to the previous candle's close
        (the WebSocket candle's `o` is the period's first trade price instead).
        `last` candles exclude ADL trades. Closed `mark`/`index` candles of `3m` and
        longer are rebuilt from the period's recorded `1m` candles; the in-progress
        `mark`/`index` candle's `open` is the previous candle's close when adjacent.

        ### Price types
        | `priceType` | Series |
        |-------------|--------|
        | `last`      | Last traded price (default). |
        | `mark`      | Mark price; volume/trade fields are copied from the `last` candles. |
        | `index`     | Index price; volume/trade fields are copied from the `last` candles. |

        ### Row format (12-element array)
        | Index | Field         | Type   |
        |-------|---------------|--------|
        | 0     | openTime      | int64  |
        | 1     | open          | string |
        | 2     | high          | string |
        | 3     | low           | string |
        | 4     | close         | string |
        | 5     | volume (base) | string |
        | 6     | closeTime     | int64  |
        | 7     | quoteVolume   | string |
        | 8     | trades        | int64  |
        | 9     | "takerBuyBase": despite the name, base volume of trades with `isBuyerMaker=true` (taker sells) | string |
        | 10    | "takerBuyQuote": quote volume of those trades | string |
        | 11    | unused, always `"0"` | string |

        True taker-buy volume = `volume - row[9]` (quote: `quoteVolume - row[10]`).

        Responses that do not include the in-progress candle are cached about 5 s (`X-Cache`).
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USD
      - name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 3m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 6h
          - 8h
          - 12h
          - 1d
          - 3d
          - 1w
          - 1M
        description: Kline interval (case-sensitive; `1M` is one month, `1m` one minute).
      - name: startTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Lower bound, Unix ms (inclusive). Only applied as a strict lower bound when `endTime` is omitted, and even then an empty window returns one seed row before it.
      - name: endTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Upper bound on candle open time, Unix ms (inclusive).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1500
          default: 500
        description: Max candles. Clamped to 1500; non-numeric or <= 0 falls back to 500.
      - name: priceType
        in: query
        required: false
        schema:
          type: string
          enum:
          - last
          - mark
          - index
          default: last
      responses:
        '200':
          description: Array of kline rows, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kline'
              example:
              - - 1792170000000
                - '79980'
                - '79980'
                - '77117.60'
                - '77117.60'
                - '0.0099'
                - 1792173599999
                - '763.464240'
                - 1
                - '0.0099'
                - '763.464240'
                - '0'
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingSymbol:
                  value:
                    code: MISSING_PARAMETER
                    msg: symbol parameter is required
                missingInterval:
                  value:
                    code: MISSING_PARAMETER
                    msg: interval parameter is required
                badInterval:
                  value:
                    code: INVALID_PARAMETER
                    msg: invalid interval
                badStart:
                  value:
                    code: INVALID_PARAMETER
                    msg: invalid startTime
                badEnd:
                  value:
                    code: INVALID_PARAMETER
                    msg: invalid endTime
                badPriceType:
                  value:
                    code: INVALID_PARAMETER
                    msg: priceType must be 'last', 'mark', or 'index'
        '500':
          description: Storage read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
  /v2/sparklines:
    get:
      tags:
      - Klines
      summary: Sparklines
      description: |
        Trailing close-price series for every **trading** market in one call (for list
        UIs). Served only from Redis, sent with `Cache-Control: public, max-age=30`,
        cached about 5 s (`X-Cache`).

        **Only `priceType=last` returns data today.** Closed mark/index candles for these
        intervals are moved to PostgreSQL and removed from Redis by the klines worker,
        so `mark`/`index` (including the default) return `data: {}`; use
        `/v2/klines?priceType=mark` for mark-price mini charts.

        Each entry holds up to `points` closes, oldest first; `openTime` is the open
        time of the first close. Redis keeps roughly the 24h before each market's
        newest candle (not before now), so an idle market's series can be old. Only
        candles with trades are stored, so a `last` series skips idle periods and is
        not evenly spaced. Markets with no candles are omitted.
      parameters:
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          default: 1h
      - name: points
        in: query
        required: false
        schema:
          type: integer
          minimum: 2
          maximum: 288
          default: 24
        description: Closes per market. Values below 2 are rejected; values above 288 are clamped.
      - name: priceType
        in: query
        required: false
        schema:
          type: string
          enum:
          - last
          - mark
          - index
          default: mark
        description: Use `last`; `mark`/`index` (and the default) currently return empty `data`. Other values → 400 INVALID_PARAMETER.
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD,ETH-USD
        description: Optional comma-separated filter (trimmed, upper-cased, de-duplicated).
      responses:
        '200':
          description: Sparkline envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparklinesResponse'
              example:
                status: OK
                interval: 1h
                priceType: last
                points: 5
                data:
                  BTC-USD:
                    openTime: 1792116000000
                    closes:
                    - '80000.0'
                    - '79980'
                    - '77117.60'
        '400':
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badInterval:
                  value:
                    code: INVALID_PARAMETER
                    msg: interval must be one of 5m, 15m, 30m, 1h, 2h, 4h
                badPoints:
                  value:
                    code: INVALID_PARAMETER
                    msg: points must be an integer >= 2
        '500':
          description: Read failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              example:
                error: failed to retrieve sparklines
  /v2/openInterest:
    get:
      tags:
      - Open Interest
      summary: Open Interest
      description: |
        One-sided open interest in base-asset units (the stored sum of absolute
        position sizes divided by 2). With `symbol` returns one object; without it
        returns an array for all markets. A market with no stored value reports `"0"`.
        `time` is the server response time.
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Open interest (object, or array when `symbol` is omitted)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OpenInterestResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/OpenInterestResponse'
              example:
                symbol: BTC-USD
                openInterest: '10.06886000000000000'
                time: 1792438631552
        '400':
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_SYMBOL
                msg: invalid symbol
  /v2/stablecoin/rates:
    get:
      tags:
      - Reference Rates
      summary: Stablecoin Rates
      description: |
        Current USD prices of stablecoin and stable-price symbols tracked by the price
        engine, as a map of symbol to decimal string. Only positive prices are included.
        Keys vary by deployment and are mixed-case (testnet also has `USDCx-USD`,
        `USDrf-USD`, `IUSD-USD`); do not hard-code the set.
      responses:
        '200':
          description: Map of symbol to USD price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinRatesResponse'
              example:
                USDC-USD: '0.99993125'
                USDT-USD: '0.9988746153846153846'
                USDM-USD: '1.000191116472927282'
                DEPOSIT-USDM-USD: '0.9974966573897500'
                WITHDRAW-USDM-USD: '1.000191116472927282'
  /v2/fxRates:
    get:
      tags:
      - Reference Rates
      summary: Fiat FX Rates
      description: |
        Display-only USD to fiat reference rates (daily ECB reference rates). `rates`
        are units of each currency per 1 USD and always include `USD: "1"` in the
        unfiltered response. `date` is the upstream publication date (lags on weekends
        and holidays); `updatedAt` is when the service last read the upstream.
        Sent with `Cache-Control: public, max-age=300`. A requested code the upstream
        does not publish is simply absent.
      parameters:
      - name: symbols
        in: query
        required: false
        schema:
          type: string
        example: EUR,JPY
        description: Optional comma-separated 3-letter currency codes (case-insensitive).
      responses:
        '200':
          description: FX rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXRatesResponse'
              example:
                status: OK
                base: USD
                date: '2026-10-19'
                updatedAt: 1792438597842
                rates:
                  EUR: '0.89087'
                  JPY: '158.24'
        '400':
          description: Malformed currency code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_PARAMETER
                msg: '"EURO" is not a 3-letter currency code'
        '503':
          description: Rates not loaded yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SERVICE_UNAVAILABLE
                msg: fx rates are not available yet
  /v2/l3/snapshot:
    servers:
    - url: https://api.strikefinance.org
      description: Mainnet (no /price prefix)
    - url: https://api-v2-testnet.strikefinance.org
      description: Testnet (no /price prefix)
    get:
      tags:
      - L3
      summary: L3 Order Book Snapshot
      description: |
        Every visible resting order for one symbol at one coherent sequence. Served by
        the L3 service directly on the API host: `https://<host>/v2/l3/snapshot`.
        The real-time feed is `wss://<host>/ws/l3`, stream `<symbol>@l3` (see the
        strike-orderbook skill for the update events and bootstrap rules).

        - Every market the engine publishes is served (new markets join at sequence
          0); any other symbol returns `400`. `symbol` is trimmed and upper-cased.
        - Complete book, never truncated or paginated. Bids descending, asks
          ascending, orders within a level in FIFO priority. Prices and sizes are
          canonical decimal strings without trailing zeros (`"72247.3"`), the same
          spelling as in WS updates.
        - `last_sequence` is in the same per-symbol domain as WS `l3_update.sequence`;
          apply updates with `sequence > last_sequence`, each exactly previous + 1.
        - `timestamp` is the server time of the read.
        - Limits: 10 requests/s per source IP, shared with `/ws/l3` handshakes.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: BTC-USD
      responses:
        '200':
          description: Complete L3 snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/L3Snapshot'
              example:
                type: l3_snapshot
                symbol: BTC-USD
                last_sequence: 11197
                timestamp: 1792438895126
                bids:
                - price: '72247.3'
                  orders:
                  - order_id: 9Ix5zep5IpZafACmP1p_3Q
                    size: '0.01107'
                - price: '72178.8'
                  orders:
                  - order_id: OKIEOZ727YYzn5Cy8JOxGA
                    size: '0.01108'
                asks: []
        '400':
          description: Unsupported or missing symbol, or unparseable client IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              examples:
                badSymbol:
                  value:
                    error: unsupported or missing symbol
                badIP:
                  value:
                    error: invalid client IP
        '403':
          description: Request reached the service on a host other than the API or DMA host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              example:
                error: L3 is unavailable on this host
        '429':
          description: Per-IP request limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              example:
                error: L3 request limit exceeded
        '503':
          description: L3 state not ready, publisher down, or rate limiter unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorText'
              examples:
                notReady:
                  value:
                    error: L3 snapshot unavailable
                limiter:
                  value:
                    error: L3 request limit unavailable
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - MISSING_PARAMETER
          - INVALID_PARAMETER
          - INVALID_SYMBOL
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
        msg:
          type: string
    ErrorText:
      type: object
      properties:
        error:
          type: string
    OrderBookResponse:
      type: object
      properties:
        lastUpdateId:
          type: integer
          format: uint64
          description: The `u` of the last published `depthUpdate`; the next one has `pu` equal to this. 0 when nothing has been published.
        E:
          type: integer
          format: int64
          description: Server response time (Unix ms).
        T:
          type: integer
          format: int64
          description: Matching-engine time of this book (Unix ms); the response time when nothing has been published.
        bids:
          type: array
          items:
            type: array
            items:
              type: string
          description: '`[price, quantity]`, highest price first.'
        asks:
          type: array
          items:
            type: array
            items:
              type: string
          description: '`[price, quantity]`, lowest price first.'
    TradeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Exchange-wide trade ID (same as WS `trade.t`). Increases per market but skips; not a gap signal.
        seq:
          type: integer
          format: uint64
          description: The trade's number on its market, +1 per trade (same as WS `trade.seq`). Absent for a moment on a trade the stream has not published yet.
        price:
          type: string
        qty:
          type: string
          description: Base quantity.
        quoteQty:
          type: string
          description: price x qty.
        time:
          type: integer
          format: int64
          description: Trade time (Unix ms).
        isBuyerMaker:
          type: boolean
          description: true when the buyer was the maker (sell-side taker). On an ADL trade the force-closed side is the taker.
        order_type:
          type: string
          enum:
          - fill
          - liquidation
          - adl
          description: '`fill` (ordinary), `liquidation` (taker was a position being liquidated) or `adl` (auto-deleveraging, off the book). Older stored trades report `fill`.'
    PremiumIndexResponse:
      type: object
      properties:
        symbol:
          type: string
        markPrice:
          type: string
        indexPrice:
          type: string
        latestPremiumIndex:
          type: string
          description: Latest premium-index sample in the active funding window ("0" before the first sample).
        averagePremiumIndex:
          type: string
          description: Duration-weighted average premium index of the active window.
        premiumIndexCount:
          type: integer
          description: Number of samples in the active window.
        fundingRate:
          type: string
          description: Live estimated hourly funding rate for the active window (same as WS `r`).
        nextFundingTime:
          type: integer
          format: int64
          description: End of the active (hourly) funding window, when it settles (Unix ms).
        interestRate:
          type: string
          description: Active per-market interest rate (8-hour basis).
        interestRateDampener:
          type: string
          description: Active per-market interest rate dampener (8-hour basis).
        fundingMultiplier:
          type: string
          description: Active per-market multiplier applied to the average premium.
        time:
          type: integer
          format: int64
          description: Snapshot time (response time, Unix ms).
    FundingInfoResponse:
      type: object
      properties:
        symbol:
          type: string
        fundingIntervalHours:
          type: integer
          description: Hours between funding payments (1).
        fundingRateCap:
          type: string
          description: Highest funding rate per interval (hourly), decimal fraction.
        fundingRateFloor:
          type: string
          description: Lowest funding rate per interval (hourly), decimal fraction.
    MarkPriceResponse:
      type: object
      properties:
        e:
          type: string
          enum:
          - markPriceUpdate
        E:
          type: integer
          format: int64
          description: Event time (Unix ms).
        s:
          type: string
          description: Symbol.
        p:
          type: string
          description: Mark price.
        i:
          type: string
          description: Index price.
        r:
          type: string
          description: Live estimated hourly funding rate for the current window (not the last settled rate).
        T:
          type: integer
          format: int64
          description: Next funding time, end of the current hourly window (Unix ms).
    IndexPriceResponse:
      type: object
      properties:
        e:
          type: string
          enum:
          - indexPriceUpdate
        E:
          type: integer
          format: int64
        s:
          type: string
        p:
          type: string
          description: Index price.
    Ticker24hrResponse:
      type: object
      properties:
        symbol:
          type: string
        priceChange:
          type: string
        priceChangePercent:
          type: string
        weightedAvgPrice:
          type: string
          description: Equals lastPrice (approximation).
        lastPrice:
          type: string
        lastQty:
          type: string
          description: Always "0".
        openPrice:
          type: string
        highPrice:
          type: string
        lowPrice:
          type: string
        volume:
          type: string
          description: 24h base volume.
        quoteVolume:
          type: string
          description: 24h quote volume.
        openTime:
          type: integer
          format: int64
        closeTime:
          type: integer
          format: int64
        firstId:
          type: integer
          format: int64
          description: Always 0.
        lastId:
          type: integer
          format: int64
          description: Always 0.
        count:
          type: integer
          format: int64
          description: Always 0.
    TickerPriceResponse:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: string
        time:
          type: integer
          format: int64
    BookTickerResponse:
      type: object
      properties:
        symbol:
          type: string
        bidPrice:
          type: string
        bidQty:
          type: string
        askPrice:
          type: string
        askQty:
          type: string
        time:
          type: integer
          format: int64
    MarketStatsResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketStatsItem'
    MarketStatsItem:
      type: object
      properties:
        symbol:
          type: string
        type:
          type: string
          enum:
          - PERPETUAL
        category:
          type: string
          enum:
          - Crypto
          - TradFi
        subCategory:
          type: string
          enum:
          - ''
          - FX
          - Commodity
          - Equity
          - Index
        assetName:
          type: string
        collateralAssetName:
          type: string
        active:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - PRE_TRADING
          - BREAK
          - CLOSED
        marketStats:
          $ref: '#/components/schemas/MarketStatsSnapshot'
        visibleOnUI:
          type: boolean
        createdAt:
          type: integer
          format: int64
          description: Unix ms (0 when unset).
    MarketStatsSnapshot:
      type: object
      properties:
        volume24h:
          type: string
          description: 24h quote volume.
        volumeBase24h:
          type: string
        priceChange24h:
          type: string
        priceChangePercentage24h:
          type: string
        low24h:
          type: string
        high24h:
          type: string
        lastPrice:
          type: string
        markPrice:
          type: string
        indexPrice:
          type: string
        fundingRate:
          type: string
        nextFundingRate:
          type: integer
          format: int64
          description: Next funding TIME (Unix ms), despite the name.
        openInterest:
          type: string
          description: openInterestBase x markPrice (USD).
        openInterestBase:
          type: string
          description: One-sided open interest (total long size = total short size), base units. Same as /v2/openInterest.
    FearGreedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
        data:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 100
            classification:
              type: string
              enum:
              - Extreme Fear
              - Fear
              - Neutral
              - Greed
              - Extreme Greed
            timestamp:
              type: integer
              format: int64
              description: When the reading was computed (Unix ms).
            components:
              type: object
              properties:
                momentum:
                  type: number
                breadth:
                  type: number
                volatility:
                  type: number
            marketsCounted:
              type: integer
    ExchangeInfoResponse:
      type: object
      properties:
        timezone:
          type: string
          enum:
          - UTC
        serverTime:
          type: integer
          format: int64
          description: Time the cached response was built (rebuilt every 2 s; not a clock).
        rateLimits:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/SymbolInfo'
    RateLimit:
      type: object
      description: Static list (REQUEST_WEIGHT 2400/min, ORDERS 1200/min).
      properties:
        rateLimitType:
          type: string
        interval:
          type: string
        intervalNum:
          type: integer
        limit:
          type: integer
    SymbolInfo:
      type: object
      properties:
        symbol:
          type: string
        pair:
          type: string
          description: Same as symbol.
        contractType:
          type: string
          enum:
          - PERPETUAL
        status:
          type: string
          enum:
          - pre_trading
          - trading
          - break
          - close
        baseAsset:
          type: string
        quoteAsset:
          type: string
          description: Symbol suffix after `-` (e.g. "USD" for BTC-USD).
        marginAsset:
          type: string
          description: Same as quoteAsset.
        pricePrecision:
          type: integer
        quantityPrecision:
          type: integer
        baseAssetPrecision:
          type: integer
        quotePrecision:
          type: integer
        underlyingType:
          type: string
          enum:
          - COIN
        underlyingSubType:
          type: array
          items:
            type: string
        settlePlan:
          type: integer
        triggerProtect:
          type: string
        liquidationFee:
          type: string
          description: Liquidation fee rate.
        limitTakeBound:
          type: string
          description: Limit-order price bound.
        marketTakeBound:
          type: string
          description: Market-order price bound.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterInfo'
        orderType:
          type: array
          items:
            type: string
          description: Static list LIMIT, MARKET, STOP, STOP_MARKET, TAKE_PROFIT, TAKE_PROFIT_MARKET.
        timeInForce:
          type: array
          items:
            type: string
          description: Engine time-in-force values GTC, IOC, ALO.
    FilterInfo:
      type: object
      description: Only the fields relevant to `filterType` are present.
      properties:
        filterType:
          type: string
          enum:
          - PRICE_FILTER
          - LOT_SIZE
          - MARKET_LOT_SIZE
          - MIN_NOTIONAL
        maxPrice:
          type: string
        minPrice:
          type: string
        tickSize:
          type: string
        maxQty:
          type: string
        minQty:
          type: string
        stepSize:
          type: string
        notional:
          type: string
    Kline:
      type: array
      description: '[openTime, open, high, low, close, volume, closeTime, quoteVolume, trades, takerBuyBase, takerBuyQuote, "0"]. Despite the names, takerBuyBase/takerBuyQuote are the volume of trades with isBuyerMaker=true (taker sells).'
      minItems: 12
      maxItems: 12
      items:
        oneOf:
        - type: integer
          format: int64
        - type: string
    SparklinesResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
        interval:
          type: string
        priceType:
          type: string
        points:
          type: integer
          description: Effective points after clamping.
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SparklineEntry'
    SparklineEntry:
      type: object
      properties:
        openTime:
          type: integer
          format: int64
          description: Open time of the first close.
        closes:
          type: array
          items:
            type: string
          description: Close prices, oldest first (may be fewer than requested).
    OpenInterestResponse:
      type: object
      properties:
        symbol:
          type: string
        openInterest:
          type: string
          description: One-sided open interest, base-asset units.
        time:
          type: integer
          format: int64
    StablecoinRatesResponse:
      type: object
      additionalProperties:
        type: string
      description: Symbol (e.g. USDC-USD) to USD price.
    FXRatesResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
        base:
          type: string
          enum:
          - USD
        date:
          type: string
          description: Upstream publication date (YYYY-MM-DD).
        updatedAt:
          type: integer
          format: int64
        rates:
          type: object
          additionalProperties:
            type: string
    L3Snapshot:
      type: object
      properties:
        type:
          type: string
          enum:
          - l3_snapshot
        symbol:
          type: string
        last_sequence:
          type: integer
          format: uint64
        timestamp:
          type: integer
          format: int64
        bids:
          type: array
          items:
            $ref: '#/components/schemas/L3PriceLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/L3PriceLevel'
    L3PriceLevel:
      type: object
      properties:
        price:
          type: string
          description: Canonical decimal without trailing zeros.
        orders:
          type: array
          items:
            type: object
            properties:
              order_id:
                type: string
                description: Opaque 22-character base64url ID, stable for the order's lifetime.
              size:
                type: string
                description: Remaining size (canonical decimal without trailing zeros).
